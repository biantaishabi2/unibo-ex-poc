source_summary: GIVEN 实体 ShoppingCart 的动作 cart_update 可执行 / WHEN 执行动作 cart_update / THEN 成功路径应满足业务约束并持久化结果 / 补充场景：create 新建购物车，cart_update 加购商品，select_carrier 选择物流，convert 转为订单；cart_update 加购后 update_pricelist 切换价格表重算价格；弃购购物车通过 recover 恢复后继续 cart_update 和 convert
