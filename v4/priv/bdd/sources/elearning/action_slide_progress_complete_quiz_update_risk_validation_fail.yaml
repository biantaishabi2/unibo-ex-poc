source_summary: GIVEN 实体 SlideProgress 的动作 complete_quiz 输入非法 / WHEN 执行动作 complete_quiz / THEN 应返回校验失败且不产生持久化副作用 / 补充场景：create 创建学习进度，complete_quiz 测验答题完成，累加尝试次数；complete_quiz 对非测验类型执行答题完成，校验失败
