source_summary: GIVEN 实体 SlideProgress 的动作 complete_quiz 可执行 / WHEN 执行动作 complete_quiz / THEN 成功路径应满足业务约束并持久化结果 / 补充场景：create 创建学习进度，complete_quiz 测验答题完成，累加尝试次数；complete_quiz 对非测验类型执行答题完成，校验失败
