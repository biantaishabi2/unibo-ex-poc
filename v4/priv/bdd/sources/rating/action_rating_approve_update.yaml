source_summary: GIVEN 实体 Rating 的动作 approve 可执行，accept=[[]]，args=[无显式参数] / WHEN 执行动作 approve / THEN 输入应满足校验规则，状态变更与副作用应生效，应触发关联事件，应符合工作流步骤约束 / 补充场景：submit 提交评价 -> approve 审核通过；submit 提交评价 -> update 修改评价 -> approve 审核通过；submit 提交评价 -> approve 审核通过 -> flag 举报评价
