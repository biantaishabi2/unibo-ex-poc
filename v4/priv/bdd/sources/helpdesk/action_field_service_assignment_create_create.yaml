source_summary: GIVEN 实体 FieldServiceAssignment 的动作 create 可执行，accept=[role, from_date, thru_date]，args=[service_order_id:uuid!, technician_id:uuid!] / WHEN 执行动作 create / THEN 状态变更与副作用应生效，应符合工作流步骤约束 / 补充场景：create 分配技术员到现场服务任务，destroy 移除分配；create 分配多名技术员（不同角色）到同一任务
