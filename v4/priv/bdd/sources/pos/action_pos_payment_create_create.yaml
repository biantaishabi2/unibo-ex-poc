module: POS_POS_PAYMENT
contract: PosPayment.create action contract
edge_class: action_contract
source_file: models/pos/pos.ubo.yaml
source_summary: GIVEN 实体 PosPayment 的动作 create 可执行，accept=[payment_method_id, amount, is_change, reference_number, card_type, cardholder_name, transaction_id, payment_status, ticket]，args=[order_id:uuid!] / WHEN 执行动作 create / THEN 输入应满足校验规则，状态变更与副作用应生效，应符合工作流步骤约束 / 补充场景：create 创建正常支付记录（amount > 0），关联订单；create 创建找零记录（amount < 0，is_change=true）；create 正常支付 amount 为负时校验失败；create 找零记录未标记 is_change 时校验失败
