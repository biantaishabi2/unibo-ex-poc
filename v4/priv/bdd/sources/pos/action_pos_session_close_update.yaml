source_summary: GIVEN 实体 PosSession 的动作 close 可执行，accept=[closing_balance_counted]，args=[无显式参数] / WHEN 执行动作 close / THEN 输入应满足校验规则，状态变更与副作用应生效，应符合工作流步骤约束 / 补充场景：create 新建会话，open 打开，start_close 开始关闭，close 关闭（触发会计分录+库存拣货）；close 存在未过账发票时尝试关闭，校验失败
