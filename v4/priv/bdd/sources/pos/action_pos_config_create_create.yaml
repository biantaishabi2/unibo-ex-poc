source_summary: GIVEN 实体 PosConfig 的动作 create 可执行，accept=[name, module_pos_restaurant, iface_splitbill, iface_printbill, iface_orderline_notes, set_tip_after_payment]，args=[无显式参数] / WHEN 执行动作 create / THEN 输入应满足校验规则，状态变更与副作用应生效，应符合工作流步骤约束 / 补充场景：create 新建终端配置（基础模式），update 启用餐饮模式及分单/打印功能；create 新建终端配置，update 关闭餐饮模式（自动关闭分单/打印开关）
