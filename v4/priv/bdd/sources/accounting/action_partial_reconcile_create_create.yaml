source_summary: GIVEN 实体 PartialReconcile 的动作 create 可执行，accept=[amount, debit_amount_currency, credit_amount_currency]，args=[debit_line_id:uuid!, credit_line_id:uuid!] / WHEN 执行动作 create / THEN 输入应满足校验规则，状态变更与副作用应生效，应符合工作流步骤约束 / 补充场景：create 部分核销连接借方行与贷方行，余额归零后触发 FullReconcile
