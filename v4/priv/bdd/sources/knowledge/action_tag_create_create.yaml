source_summary: GIVEN 实体 Tag 的动作 create 可执行，accept=[name, color]，args=[无显式参数] / WHEN 执行动作 create / THEN 输入应满足校验规则，状态变更与副作用应生效，应符合工作流步骤约束 / 补充场景：create 新建标签，update 修改名称或颜色；create 新建标签后，destroy 删除标签；create 重复标签名称，唯一性校验失败
