source_summary: GIVEN 实体 LunchTopping 的动作 create 可执行，accept=[name, price, topping_category]，args=[supplier_id:uuid!] / WHEN 执行动作 create / THEN 输入应满足校验规则，状态变更与副作用应生效，应符合工作流步骤约束 / 补充场景：create 新建配料，update 修改价格和分类；create 新建配料，destroy 删除配料；create 价格为负数，校验失败
