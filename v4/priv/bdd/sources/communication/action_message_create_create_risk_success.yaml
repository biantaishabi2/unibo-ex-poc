source_summary: GIVEN 实体 Message 的动作 create 可执行 / WHEN 执行动作 create / THEN 成功路径应满足业务约束并持久化结果 / 补充场景：create -> update -> toggle_star -> send_transient -> destroy；发布消息更新所有成员的 is_pinned 和 last_interest_dt；创建通知记录，分发到 Inbox/Email/Web Push/Bus 四种渠道；Base64 图片提取为附件，语音附件元数据提取；discuss.channel/new_message 实时广播；message_post() 是通用 mixin，任何业务实体都可通过 mail.thread 获得消息能力；字段变更追踪，支持按用户组过滤可见性
