source_summary: GIVEN 实体 BomRevision 的工作流 bom_where_used_analysis 存在分支或异常可能 / WHEN 执行分支路径 / THEN 流程应可恢复并保持状态一致 / 补充场景：collect_component_usages 收集组件使用 -> build_recursive_bom_tree 构建递归 BOM 树；给定零件查出引用该零件的所有 BOM（递归向上遍历）
