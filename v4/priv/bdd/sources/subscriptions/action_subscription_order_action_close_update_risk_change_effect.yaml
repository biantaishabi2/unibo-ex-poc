source_summary: GIVEN 实体 SubscriptionOrder 的动作 action_close 触发副作用 / WHEN 执行动作 action_close / THEN 变更副作用应完整生效且状态一致 / 补充场景：create 新建订阅，action_confirm 确认，action_close 手动关闭（指定关闭原因）；create 新建订阅，action_confirm 确认，action_close 关闭，action_renew 续订（生成新草稿）；action_close 对非 in_progress 状态关闭，校验失败
