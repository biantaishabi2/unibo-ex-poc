source_summary: GIVEN 实体 SubscriptionOrder 的动作 action_confirm 可执行，accept=[[]]，args=[无显式参数] / WHEN 执行动作 action_confirm / THEN 输入应满足校验规则，状态变更与副作用应生效，应触发关联事件，应符合工作流步骤约束 / 补充场景：create 新建订阅，action_confirm 确认（draft→in_progress），生成首张发票；create 新建订阅，action_confirm 确认，action_pause 暂停，action_resume 恢复；action_confirm 对非 draft 状态确认，校验失败
