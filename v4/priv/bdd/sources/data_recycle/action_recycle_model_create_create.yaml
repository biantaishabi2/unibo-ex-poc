source_summary: GIVEN 实体 RecycleModel 的动作 create 可执行，accept=[name, res_model_name, domain, time_field, time_field_delta, time_field_delta_unit, recycle_mode, recycle_action, include_archived, active, notify_frequency, notify_frequency_period]，args=[无显式参数] / WHEN 执行动作 create / THEN 输入应满足校验规则，状态变更与副作用应生效，应符合工作流步骤约束 / 补充场景：create 新建回收规则，update 调整时间窗口与回收模式；create 新建回收规则后，recycle_records_action 手动触发回收任务；create 新建自动规则后，cron_recycle 定时执行批量扫描与回收；create 新建回收规则后，destroy 删除规则；create 时 recycle_action 非法值，校验失败
