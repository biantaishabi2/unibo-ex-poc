source_summary: GIVEN 实体 Post 的动作 close 可执行，accept=[(未声明)]，args=[close_reason_id:uuid!] / WHEN 执行动作 close / THEN 输入应满足校验规则，状态变更与副作用应生效，应触发关联事件，应符合工作流步骤约束 / 补充场景：create 新建问题，update 编辑内容，close 关闭帖子；create 新建帖子，close 关闭后 reopen 重新打开；close 尝试对非 active 状态帖子关闭，校验失败
