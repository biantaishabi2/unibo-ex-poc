# 日历调班页 — 日历网格 + 分配卡片 + violation 侧栏
version: "1.0"
page:
  name: calendar_adjustment
  title: 日历调班
  route: /scheduling/periods/:id/versions/:version_id/calendar
  page_type: composition
  entity: ShiftAssignment
  audience: admin

  permissions:
    access: role
    roles: [admin]

  data_sources:
    - name: period
      type: read
      resource: Scheduling.SchedulingPeriod
      params:
        id: route.id
    - name: version
      type: read
      resource: Scheduling.ScheduleVersion
      params:
        id: route.version_id
    - name: assignments
      type: list
      resource: Scheduling.ShiftAssignment
      params:
        version_id: route.version_id
      default_sort: { field: starts_at, order: asc }
    - name: requirements
      type: list
      resource: Scheduling.CoverageRequirement
      params:
        period_id: route.id
      default_sort: { field: requirement_date, order: asc }
    - name: violations
      type: list
      resource: Scheduling.ConstraintViolation
      params:
        version_id: route.version_id
    - name: shift_types
      type: list
      resource: Scheduling.ShiftType
      params:
        department_id: period.department_id
        enabled: true
      default_sort: { field: sort_order, order: asc }

  layout:
    - type: Stack
      gap: 0
      children:
        # 顶部工具栏
        - type: Flex
          gap: 3
          props:
            justify: between
            align: center
            padding: 4
          children:
            - type: Stack
              gap: 1
              children:
                - type: Text
                  bind:
                    content: "日历调班 — {{ period.title }}"
                  props:
                    variant: heading
                - type: Flex
                  gap: 2
                  children:
                    - type: Badge
                      bind:
                        label: period.state
                    - type: Text
                      bind:
                        content: "版本 {{ version.version_no }}"
                      props:
                        variant: muted
                    - type: Badge
                      bind:
                        label: version.origin_type
            - type: Flex
              gap: 2
              children:
                - type: Button
                  bind:
                    label: 返回结果页
                    variant: secondary
                  action: navigate
                  params:
                    to: /scheduling/periods/{{ route.id }}/runs/{{ period.last_solver_run.id }}/result
                - type: Button
                  bind:
                    label: 发布预览
                    variant: primary
                  action: navigate
                  params:
                    to: /scheduling/periods/{{ route.id }}/versions/{{ route.version_id }}/publish-preview

        # 主体区域：日历 + 侧栏
        - type: Flex
          gap: 0
          children:
            # 左侧：日历主体
            - type: Stack
              gap: 3
              props:
                flex: 3
                padding: 4
              children:
                # 班次筛选栏
                - type: Flex
                  gap: 2
                  children:
                    - type: Button
                      bind:
                        label: 全部班次
                        variant: secondary
                      action: filter_shift_type
                      params:
                        shift_type_id: null
                    - type: Stack
                      gap: 1
                      children_from:
                        source: shift_types
                        template:
                          type: Button
                          bind:
                            label: item.name
                            variant: outline
                          action: filter_shift_type
                          params:
                            shift_type_id: item.id

                # 日历网格
                - type: ScheduleMatrix
                  bind:
                    rows: shift_types
                    columns_from: period
                    cells: assignments
                    requirements_overlay: requirements
                    row_label_field: name
                    column_type: date_range
                    cell_fields:
                      primary: employee.name
                      badge_locked: is_locked
                      source: source
                  props:
                    editable: true
                    draggable: true
                    show_coverage_indicator: true
                    highlight_violations: true
                    on_cell_click: show_assignment_detail
                    on_drag_drop: move_assignment

            # 右侧：violation 侧栏
            - type: Stack
              gap: 3
              props:
                flex: 1
                padding: 4
                border_left: true
              children:
                - type: Text
                  bind:
                    content: 约束违反
                  props:
                    variant: subheading

                # Error violations
                - type: Stack
                  gap: 2
                  children_from:
                    source: violations
                    template:
                      type: Alert
                      bind:
                        title: item.rule_code
                        description: item.message
                      props:
                        variant: destructive
                      visible_when:
                        field: item.severity
                        op: eq
                        value: error

                # Warning violations
                - type: Stack
                  gap: 2
                  children_from:
                    source: violations
                    template:
                      type: Alert
                      bind:
                        title: item.rule_code
                        description: item.message
                      props:
                        variant: warning
                      visible_when:
                        field: item.severity
                        op: eq
                        value: warning

                - type: EmptyState
                  bind:
                    title: 无违反
                    description: 当前排班满足所有约束
                  visible_when:
                    field: violations
                    op: not_empty
                    value: false

        # 底部操作栏
        - type: Flex
          gap: 2
          props:
            justify: between
            padding: 4
            border_top: true
          children:
            - type: Flex
              gap: 2
              children:
                - type: Button
                  bind:
                    label: 锁定选中
                    variant: secondary
                  action: lock_selected
                - type: Button
                  bind:
                    label: 解锁选中
                    variant: secondary
                  action: unlock_selected
            - type: Button
              bind:
                label: 保存调整
                variant: primary
              action: save_adjustments
