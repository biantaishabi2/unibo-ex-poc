# 约束配置页
version: "1.0"
page:
  name: constraint_list
  title: 排班约束配置
  route: /scheduling/periods/:id/constraints
  page_type: list_report
  entity: SchedulingConstraint
  audience: admin

  permissions:
    access: role
    roles: [admin]

  data_sources:
    - name: constraints
      type: list
      resource: Scheduling.SchedulingConstraint
      params:
        department_id: period.department_id
      sort:
        - field: constraint_type
          direction: asc

  slots:
    filter_bar:
      - field: constraint_type
        type: select
        label: 约束类型
        options:
          - { label: 全部, value: "" }
          - { label: 硬约束, value: hard }
          - { label: 软约束, value: soft }
      - field: category
        type: select
        label: 规则类别
        options:
          - { label: 全部, value: "" }
          - { label: 夜班后休息, value: rest_after_night }
          - { label: 最大连续天数, value: max_consecutive_days }
          - { label: 请假尊重, value: respect_leave }
          - { label: 技能要求, value: skill_requirement }
          - { label: 月度工时上限, value: max_monthly_hours }
          - { label: 带班覆盖, value: lead_coverage }
          - { label: 夜班公平, value: fair_night_distribution }
          - { label: 周末公平, value: fair_weekend_distribution }
          - { label: 偏好尊重, value: respect_preference }
          - { label: 连续夜班限制, value: limit_consecutive_nights }
          - { label: 班次连续性, value: shift_continuity }
      - field: enabled
        type: select
        label: 状态
        options:
          - { label: 全部, value: "" }
          - { label: 启用, value: "true" }
          - { label: 停用, value: "false" }

    table:
      columns:
        - field: name
          label: 规则名称
        - field: constraint_type
          label: 约束类型
          render: badge
        - field: category
          label: 规则类别
          render: badge
        - field: weight
          label: 权重
        - field: enabled
          label: 启用
          render: badge
        - field: notes
          label: 备注

      row_actions:
        - label: 编辑
          action: navigate
          params:
            to: /scheduling/constraints/{{ row.id }}/edit
        - label: 启用
          action: update
          params:
            enabled: true
          visible_when:
            field: enabled
            op: eq
            value: false
        - label: 停用
          action: update
          params:
            enabled: false
          visible_when:
            field: enabled
            op: eq
            value: true
        - label: 删除
          action: destroy
          confirm: 确定删除该约束规则吗？

    toolbar:
      actions:
        - label: 新建约束
          action: navigate
          params:
            to: /scheduling/constraints/new
          variant: primary
        - label: 返回周期详情
          action: navigate
          params:
            to: /scheduling/periods/{{ route.id }}
          variant: secondary
