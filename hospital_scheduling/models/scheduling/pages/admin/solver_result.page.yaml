# 自动排班结果页 — 展示求解 summary、coverage、violations
version: "1.0"
page:
  name: solver_result
  title: 排班结果
  route: /scheduling/periods/:id/runs/:run_id/result
  page_type: composition
  entity: SolverRun
  audience: admin

  permissions:
    access: role
    roles: [admin]

  data_sources:
    - name: period
      type: read
      resource: Scheduling.SchedulingPeriod
      params:
        id: route.id
    - name: run
      type: read
      resource: Scheduling.SolverRun
      params:
        id: route.run_id
    - name: violations
      type: list
      resource: Scheduling.ConstraintViolation
      params:
        version_id: run.version_id
      default_sort: { field: severity, order: asc }

  layout:
    - type: Stack
      gap: 4
      children:
        # 页面头部
        - type: Flex
          gap: 3
          props:
            justify: between
            align: center
          children:
            - type: Stack
              gap: 1
              children:
                - type: Text
                  bind:
                    content: "排班结果 — {{ period.title }}"
                  props:
                    variant: heading
                - type: Flex
                  gap: 2
                  children:
                    - type: Badge
                      bind:
                        label: run.status
                    - type: Text
                      bind:
                        content: "算法: {{ run.engine_type }}"
                      props:
                        variant: muted
            - type: Button
              bind:
                label: 返回周期详情
                variant: secondary
              action: navigate
              params:
                to: /scheduling/periods/{{ route.id }}

        # 求解概览 KPI 卡片
        - type: Grid
          columns: 4
          gap: 3
          children:
            - type: StatisticCard
              bind:
                title: 总分配数
                value: run.output_snapshot.summary.assignment_count
            - type: StatisticCard
              bind:
                title: 覆盖需求数
                value: run.output_snapshot.summary.covered_requirement_count
            - type: StatisticCard
              bind:
                title: 硬约束违反
                value: run.hard_violation_count
              props:
                variant: danger
            - type: StatisticCard
              bind:
                title: 警告数
                value: run.warning_count
              props:
                variant: warning

        # Error violations 提示
        - type: Alert
          bind:
            title: 存在硬约束违反
            description: "有 {{ run.hard_violation_count }} 个硬约束违反需要处理，建议进入日历调班页手动调整。"
          props:
            variant: destructive
          visible_when:
            field: run.hard_violation_count
            op: gt
            value: 0

        # 违反列表
        - type: Card
          slots:
            header:
              - type: Text
                bind:
                  content: 约束违反明细
                props:
                  variant: subheading
            content:
              - type: Table
                bind:
                  data: violations
                  columns:
                    - field: severity
                      label: 级别
                      render: badge
                    - field: rule_code
                      label: 规则编码
                    - field: message
                      label: 说明
                props:
                  empty_text: 无约束违反，排班结果良好

        # 底部操作
        - type: Flex
          gap: 2
          props:
            justify: end
          children:
            - type: Button
              bind:
                label: 进入日历调班
                variant: primary
              action: navigate
              params:
                to: /scheduling/periods/{{ route.id }}/versions/{{ period.current_version.id }}/calendar
            - type: Button
              bind:
                label: 直接发布预览
                variant: secondary
              action: navigate
              visible_when:
                field: run.hard_violation_count
                op: eq
                value: 0
              params:
                to: /scheduling/periods/{{ route.id }}/versions/{{ period.current_version.id }}/publish-preview
