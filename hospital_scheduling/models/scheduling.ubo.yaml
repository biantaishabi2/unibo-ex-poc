  # authorization_plan:
  #   status: planned
  #   mode: authz_domain
  #   data_scope: org_scope
  #   capabilities:
  #     - scheduling_system: [create, start_run, complete_feasible, complete_infeasible, mark_timeout, mark_error, mark_completed]
  #     - scheduling_manage: [read]
  #   notes: 仅系统/管理员可触发求解，护长可查看求解结果
  - name: SolverRun
    description: 一次求解执行记录与输入/输出快照载体
    aggregate_root: false
    attributes:
      - name: id
        type: uuid
        primary_key: true
        generated: true
      - name: status
        type: enum
        required: true
        default: pending
        constraints:
          values: [pending, running, feasible, infeasible, timeout, error, completed]
        description: 求解状态
      - name: engine_type
        type: string
        required: true
        default: cp_sat
        description: 算法标识
      - name: seed
        type: integer
        description: 随机种子，用于复现实验
      - name: timeout_ms
        type: integer
        required: true
        default: 30000
        description: 超时毫秒数
      - name: started_at
        type: datetime
        description: 求解开始时间
      - name: completed_at
        type: datetime
        description: 求解结束时间
      - name: score
        type: decimal
        description: 总评分
      - name: hard_violation_count
        type: integer
        required: true
        default: 0
        description: 硬约束违反数
      - name: warning_count
        type: integer
        required: true
        default: 0
        description: 警告数
      - name: input_snapshot
        type: jsonb
        required: true
        default: {}
        description: 输入快照（跨域数据在 run 开始时一次性冻结）
      - name: output_snapshot
        type: jsonb
        description: 输出摘要（不重复整份 assignment 明细）
      - name: error_message
        type: text
        description: 错误信息
      - name: inserted_at
        type: datetime
        generated: true
      - name: updated_at
        type: datetime
        generated: true
    relationships:
      - name: period
        type: belongs_to
        target: SchedulingPeriod
        foreign_key: period_id
        required: true
    actions:
      - name: create
        type: create
        primary: true
        accept: [engine_type, seed, timeout_ms, input_snapshot]
      - name: update
        type: update
        primary: true
        accept: [status, started_at, completed_at, score, hard_violation_count, warning_count, output_snapshot, error_message]
      - name: read
        type: read
        primary: true
      - name: start_run
        type: update
        description: 标记求解开始
        accept: []
        changes:
          - effect: set_attribute
            field: status
            value: running
      - name: complete_feasible
        type: update
        description: 求解完成（可行解）
        accept: [score, hard_violation_count, warning_count, output_snapshot]
        changes:
          - effect: set_attribute
            field: status
            value: feasible
      - name: complete_infeasible
        type: update
        description: 求解完成（不可行）
        accept: [score, hard_violation_count, warning_count, output_snapshot, error_message]
        changes:
          - effect: set_attribute
            field: status
            value: infeasible
      - name: mark_timeout
        type: update
        description: 求解超时
        accept: [score, hard_violation_count, warning_count, output_snapshot]
        changes:
          - effect: set_attribute
            field: status
            value: timeout
      - name: mark_error
        type: update
        description: 求解出错
        accept: [error_message]
        changes:
          - effect: set_attribute
            field: status
            value: error
      - name: mark_completed
        type: update
        description: 最终完成（用户确认采用此结果）
        accept: []
        changes:
          - effect: set_attribute
            field: status
            value: completed
      - name: destroy
        type: destroy
    state_machine:
      initial_state: pending
      state_attribute: status
      states: [pending, running, feasible, infeasible, timeout, error, completed]
      transitions:
        - from: pending
          to: running
          event: start_run
        - from: running
          to: feasible
          event: complete_feasible
        - from: running
          to: infeasible
          event: complete_infeasible
        - from: running
          to: timeout
          event: mark_timeout
        - from: running
          to: error
          event: mark_error
        - from: feasible
          to: completed
          event: mark_completed
    validations:
      - rule: one_of
        field: status
        params: {values: [pending]}
        on: [start_run]
        message: 只有待执行状态可以开始
      - rule: one_of
        field: status
        params: {values: [running]}
        on: [complete_feasible, complete_infeasible, mark_timeout, mark_error]
        message: 只有运行中状态可以完成
    workflows:
      - name: solver_run_lifecycle
        description: 求解运行生命周期
        steps:
          - action: create
            next: [start_run]
          - action: start_run
            next: [complete_feasible, complete_infeasible, mark_timeout, mark_error]
          - action: complete_feasible
            next: [mark_completed]
          - action: mark_timeout
            next: [mark_completed]
    events:
      - on: start_run
        topic: scheduling.solver.started
      - on: complete_feasible
        topic: scheduling.solver.completed
      - on: complete_infeasible
        topic: scheduling.solver.infeasible
      - on: mark_error
        topic: scheduling.solver.errored
      - on: mark_timeout
        topic: scheduling.solver.timed_out
    integrations:
      - name: rust_solver_invoke
        on: [start_run]
        mode: async
        request:
          - name: period_id
            type: uuid
          - name: constraints
            type: map
          - name: preferences
            type: map
        response:
          - name: solution
            type: map
          - name: feasibility
            type: string
          - name: score
            type: decimal
        errors:
          - code: solver_timeout
            retryable: true
          - code: solver_crash
            retryable: true
          - code: invalid_input
            retryable: false
        async:
          queue: solver_jobs
          timeout_ms: 300000
          idempotency_key: period_id

  # authorization_plan:
  #   status: planned
  #   mode: authz_domain
  #   data_scope: org_scope
  #   capabilities:
  #     - scheduling_system: [create, destroy]
  #     - scheduling_manage: [read]
  #     - scheduling_view: [read]
  #   notes: 系统生成违反记录，护长和本科室人员可查看
  - name: ConstraintViolation
    description: 结构化记录约束违反（error 或 warning）
    aggregate_root: false
    read_filters:
      - name: by_version
        description: 按版本筛选约束违反
        filter:
          version_id: :version_id
      - name: by_version_and_severity
        description: 按版本和严重级别筛选约束违反
        filter:
          version_id: :version_id
          severity: :severity
      - name: errors_only
        description: 只返回 error 级违反（用于发布前检查）
        filter:
          version_id: :version_id
          severity: error
      - name: by_assignment
        description: 按排班分配筛选相关违反
        filter:
          assignment_id: :assignment_id
    attributes:
      - name: id
        type: uuid
        primary_key: true
        generated: true
      - name: rule_code
        type: string
        required: true
        description: 规则编码，如 rest_after_night
      - name: severity
        type: enum
        required: true
        constraints:
          values: [error, warning]
        description: 严重级别
      - name: message
        type: string
        required: true
        description: 面向用户的说明
      - name: details_json
        type: jsonb
        required: true
        default: {}
        description: 结构化细节
      - name: inserted_at
        type: datetime
        generated: true
    relationships:
      - name: period
        type: belongs_to
        target: SchedulingPeriod
        foreign_key: period_id
        required: true
      - name: version
        type: belongs_to
        target: ScheduleVersion
        foreign_key: version_id
        required: true
      - name: assignment
        type: belongs_to
        target: ShiftAssignment
        foreign_key: assignment_id
        description: 若是具体 assignment 触发
      - name: requirement
        type: belongs_to
        target: CoverageRequirement
        foreign_key: requirement_id
        description: 若是 requirement 级问题
    actions:
      - name: create
        type: create
        primary: true
        accept: [period_id, version_id, assignment_id, requirement_id, rule_code, severity, message, details_json]
      - name: read
        type: read
        primary: true
      - name: destroy
        type: destroy
        primary: true
