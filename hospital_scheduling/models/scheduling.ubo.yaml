        type: create
        primary: true
        accept: [period_id, preferred_shift_tags, unavailable_dates, max_night_shifts, notes]
      - name: update
        type: update
        primary: true
        accept: [preferred_shift_tags, unavailable_dates, max_night_shifts, notes]
      - name: read
        type: read
        primary: true
      - name: destroy
        type: destroy
        primary: true

