version: "1.0"
domain:
  name: Scheduling
  subdomain: scheduling
  description: 护士排班核心域 — 科室月排班工作空间、班次类型、覆盖需求、排班分配、约束管理、求解运行与版本管理

entities:

  # ── 跨域引用 ────────────────────────────────────────────────

  # authorization_plan:
  #   status: planned
  #   mode: authz_domain
  #   data_scope: public_readonly
  #   capabilities:
  #     - scheduling_view: [read]
  #   notes: 跨域只读引用，权限由 HR 域控制
  - name: Employee
    description: 跨域引用 HR.Employee（护士/医护人员）
    cross_domain_ref:
      domain: hr
      entity: Employee
    aggregate_root: false
    attributes:
      - name: id
        type: uuid
        primary_key: true
        generated: true
      - name: employee_code
        type: string
      - name: name
        type: string
    actions:
      - name: read
        type: read
        primary: true

  # authorization_plan:
  #   status: planned
  #   mode: authz_domain
  #   data_scope: public_readonly
  #   capabilities:
  #     - scheduling_view: [read]
  #   notes: 跨域只读引用，权限由 HR 域控制
  - name: Department
    description: 跨域引用 HR.Department（科室）
    cross_domain_ref:
      domain: hr
      entity: Department
    aggregate_root: false
    attributes:
      - name: id
        type: uuid
        primary_key: true
        generated: true
      - name: name
        type: string
    actions:
      - name: read
        type: read
        primary: true

  # ── 本域实体 ────────────────────────────────────────────────

  # authorization_plan:
  #   status: planned
  #   mode: authz_domain
  #   data_scope: org_scope
  #   capabilities:
  #     - scheduling_admin: [create, update, destroy]
  #     - scheduling_view: [read]
  #   notes: 管理员配置班次类型，本科室可查看
  - name: ShiftType
    description: 班次类型定义（早班/中班/夜班等），是排班的基础维度
    aggregate_root: true
    read_filters:
      - name: by_department
        description: 按科室筛选班次类型
        filter:
          department_id: :department_id
      - name: enabled_only
        description: 只返回启用的班次类型
        filter:
          enabled: true
      - name: by_department_enabled
        description: 按科室筛选且只返回启用的班次类型
        filter:
          department_id: :department_id
          enabled: true
    attributes:
      - name: id
        type: uuid
        primary_key: true
        generated: true
      - name: code
        type: string
        required: true
        description: 班次编码，如 day, evening, night
      - name: name
        type: string
        required: true
        description: 班次名称，如"白班"、"小夜"、"大夜"
      - name: start_time
        type: time
        required: true
        description: 班次开始时间，如 08:00
      - name: end_time
        type: time
        required: true
        description: 班次结束时间，如 16:00
      - name: duration_hours
        type: decimal
        required: true
        description: 时长（小时），跨午夜时 end < start
      - name: is_night
        type: boolean
        required: true
        default: false
        description: 是否算夜班（影响夜班公平性约束）
      - name: color
        type: string
        description: 前端显示色，如 #4CAF50
      - name: sort_order
        type: integer
        required: true
        default: 0
        description: 排序权重
      - name: enabled
        type: boolean
        required: true
        default: true
        description: 是否启用
      - name: inserted_at
        type: datetime
        generated: true
      - name: updated_at
        type: datetime
        generated: true
    relationships:
      - name: department
        type: belongs_to
        target: Department
        foreign_key: department_id
        required: true
        description: 归属科室
      - name: coverage_requirements
        type: has_many
        target: CoverageRequirement
        foreign_key: shift_type_id
    identities:
      - name: unique_dept_shift_code
        keys: [department_id, code]
    actions:
      - name: create
        type: create
        primary: true
        accept: [code, name, start_time, end_time, duration_hours, is_night, color, sort_order, enabled]
      - name: update
        type: update
        primary: true
        accept: [name, start_time, end_time, duration_hours, is_night, color, sort_order, enabled]
      - name: read
        type: read
        primary: true
      - name: destroy
        type: destroy
        primary: true
    validations:
      - rule: present
        field: code
        on: [create]
      - rule: present
        field: name
        on: [create]

  # authorization_plan:
  #   status: planned
  #   mode: authz_domain
  #   data_scope: org_scope
  #   capabilities:
  #     - scheduling_manage: [create, update, destroy, start_generating, mark_generated, mark_adjusted, publish]
  #     - scheduling_view: [read]
  #   notes: 护长/科主任可管理排班周期，本科室人员可查看
  - name: SchedulingPeriod
    description: 一次科室月排班工作空间，承载需求、版本、求解运行
    aggregate_root: true
    attributes:
      - name: id
        type: uuid
        primary_key: true
        generated: true
      - name: start_date
        type: date
        required: true
        description: 周期开始日期（本地业务日）
      - name: end_date
        type: date
        required: true
        description: 周期结束日期（本地业务日）
      - name: state
        type: enum
        required: true
        default: draft
        constraints:
          values: [draft, generating, generated, adjusted, published]
        description: 排班周期状态
      - name: title
        type: string
        description: 例如"ICU 2026-04 月排班"
      - name: generation_mode
        type: enum
        required: true
        default: blank
        constraints:
          values: [blank, cloned_from_previous, solver_seeded]
        description: 排班生成方式
      - name: notes
        type: text
        description: 备注
      - name: inserted_at
        type: datetime
        generated: true
      - name: updated_at
        type: datetime
        generated: true
    relationships:
      - name: department
        type: belongs_to
        target: Department
        foreign_key: department_id
        required: true
        description: 排班科室
      - name: source_period
        type: belongs_to
        target: SchedulingPeriod
        foreign_key: source_period_id
        description: 复制来源周期（从上一期复制时指向）
      - name: source_version
        type: belongs_to
        target: ScheduleVersion
        foreign_key: source_version_id
        description: 复制来源版本（从上一期哪个版本复制）
      - name: current_version
        type: belongs_to
        target: ScheduleVersion
        foreign_key: current_version_id
        description: 当前工作版本
      - name: published_version
        type: belongs_to
        target: ScheduleVersion
        foreign_key: published_version_id
        description: 当前已发布版本
      - name: last_solver_run
        type: belongs_to
        target: SolverRun
        foreign_key: last_solver_run_id
        description: 最近一次求解运行
      - name: coverage_requirements
        type: has_many
        target: CoverageRequirement
        foreign_key: period_id
      - name: schedule_versions
        type: has_many
        target: ScheduleVersion
        foreign_key: period_id
      - name: solver_runs
        type: has_many
        target: SolverRun
        foreign_key: period_id
      - name: shift_assignments
        type: has_many
        target: ShiftAssignment
        foreign_key: period_id
      - name: constraint_violations
        type: has_many
        target: ConstraintViolation
        foreign_key: period_id
    actions:
      - name: create
        type: create
        primary: true
        accept: [start_date, end_date, title, notes, generation_mode]
      - name: update
        type: update
        primary: true
        accept: [title, notes]
      - name: read
        type: read
        primary: true
      - name: destroy
        type: destroy
        primary: true
      - name: start_generating
        type: update
        description: 开始自动生成排班
        accept: []
        changes:
          - effect: invoke
            target: SchedulingBridge
            method: trigger_solver_run
          - effect: set_attribute
            field: state
            value: generating
      - name: mark_generated
        type: update
        description: 求解完成，标记为已生成
        accept: []
        changes:
          - effect: set_attribute
            field: state
            value: generated
      - name: mark_adjusted
        type: update
        description: 人工调班后标记
        accept: []
        changes:
          - effect: set_attribute
            field: state
            value: adjusted
      - name: publish
        type: update
        description: 发布排班（需无 error 级违反）
        accept: []
        changes:
          - effect: invoke
            target: SchedulingBridge
            method: publish_period_current_version
          - effect: set_attribute
            field: state
            value: published
    state_machine:
      initial_state: draft
      state_attribute: state
      states: [draft, generating, generated, adjusted, published]
      transitions:
        - from: draft
          to: generating
          event: start_generating
        - from: generating
          to: generated
          event: mark_generated
        - from: generated
          to: adjusted
          event: mark_adjusted
        - from: adjusted
          to: published
          event: publish
        - from: generated
          to: published
          event: publish
    validations:
      - rule: compare
        field: end_date
        params: {greater_than: start_date}
        message: 结束日期必须晚于开始日期
      - rule: one_of
        field: state
        params: {values: [draft]}
        on: [start_generating]
        message: 只有草稿状态可以开始生成
      - rule: one_of
        field: state
        params: {values: [generated, adjusted]}
        on: [publish]
        message: 只有已生成或已调整状态可以发布
    event_consumers:
      # ScheduleVersion 发布后，回写 SchedulingPeriod.published_version_id
      - topic: ScheduleVersion.published_version
        action: update
        description: 版本发布后更新 SchedulingPeriod 的 published_version_id
        changes:
          - effect: set_attribute
            field: published_version_id
            source: event.entity_id
          - effect: set_attribute
            field: state
            value: published
      # SolverRun 完成可行解后，回写 current_version_id / last_solver_run_id
      - topic: SolverRun.complete_feasible
        action: update
        description: 求解完成后更新 SchedulingPeriod 的 current_version_id 和 last_solver_run_id
        changes:
          - effect: set_attribute
            field: last_solver_run_id
            source: event.entity_id
          - effect: set_attribute
            field: state
            value: generated
    determine_actions:
      # SolverRun 完成后跨聚合写回 SchedulingPeriod（current_version_id / last_solver_run_id）
      - name: on_solver_run_complete_feasible
        trigger: SolverRun.complete_feasible
        target_entity: SchedulingPeriod
        target_action: mark_generated
        description: 求解可行解完成 → 更新排班周期为 generated 并记录 last_solver_run_id
        lookup:
          via: SolverRun.period_id
        scope: cross_aggregate
        mode: async_write_back
        write_set: [state]
      # ScheduleVersion 发布后跨聚合写回 SchedulingPeriod.published_version_id
      - name: on_schedule_version_publish
        trigger: ScheduleVersion.publish_version
        target_entity: SchedulingPeriod
        target_action: publish
        description: 版本发布 → 排班周期状态迁移到 published 并记录 published_version_id
        lookup:
          via: ScheduleVersion.period_id
        scope: cross_aggregate
        mode: async_write_back
        write_set: [state]
    workflows:
      - name: scheduling_period_lifecycle
        description: 排班周期生命周期
        steps:
          - action: create
            next: [start_generating, update, destroy]
          - action: start_generating
            next: [mark_generated]
          - action: mark_generated
            next: [mark_adjusted, publish, start_generating]
          - action: mark_adjusted
            next: [publish, start_generating]
          - action: publish
            next: [start_generating]
    events:
      - on: create
        topic: scheduling.period.created
      - on: mark_generated
        topic: scheduling.period.generated
      - on: mark_adjusted
        topic: scheduling.period.adjusted

  # authorization_plan:
  #   status: planned
  #   mode: authz_domain
  #   data_scope: org_scope
  #   capabilities:
  #     - scheduling_admin: [create, update, destroy]
  #     - scheduling_view: [read]
  #   notes: 管理员配置覆盖需求，本科室可查看
  - name: CoverageRequirement
    description: 定义某天某班次某岗位需要多少人
    aggregate_root: false
    read_filters:
      - name: by_period
        description: 按排班周期筛选需求
        filter:
          period_id: :period_id
      - name: by_period_and_date
        description: 按排班周期和日期筛选需求
        filter:
          period_id: :period_id
          requirement_date: :requirement_date
      - name: by_period_and_shift_type
        description: 按排班周期和班次类型筛选需求
        filter:
          period_id: :period_id
          shift_type_id: :shift_type_id
    attributes:
      - name: id
        type: uuid
        primary_key: true
        generated: true
      - name: requirement_date
        type: date
        required: true
        description: 需求日期（本地业务日）
      - name: role_code
        type: string
        required: true
        description: 岗位编码，如 duty_nurse
      - name: role_name
        type: string
        description: 岗位名称
      - name: required_skill_tags
        type: array
        default: []
        description: 所需技能标签，如 ["ICU"]
      - name: min_headcount
        type: integer
        required: true
        description: 最低人数
      - name: target_headcount
        type: integer
        description: 目标人数，不填时等于 min_headcount
      - name: required_lead_count
        type: integer
        required: true
        default: 0
        description: 需要带班人数
      - name: priority
        type: integer
        required: true
        default: 100
        description: 优先级，越小越高
      - name: notes
        type: text
        description: 备注
      - name: inserted_at
        type: datetime
        generated: true
      - name: updated_at
        type: datetime
        generated: true
    relationships:
      - name: period
        type: belongs_to
        target: SchedulingPeriod
        foreign_key: period_id
        required: true
      - name: shift_type
        type: belongs_to
        target: ShiftType
        foreign_key: shift_type_id
        required: true
      - name: shift_assignments
        type: has_many
        target: ShiftAssignment
        foreign_key: requirement_id
      - name: constraint_violations
        type: has_many
        target: ConstraintViolation
        foreign_key: requirement_id
    identities:
      - name: unique_period_date_shift_role
        keys: [period_id, requirement_date, shift_type_id, role_code]
    actions:
      - name: create
        type: create
        primary: true
        accept: [requirement_date, role_code, role_name, required_skill_tags, min_headcount, target_headcount, required_lead_count, priority, notes]
      - name: update
        type: update
        primary: true
        accept: [role_name, required_skill_tags, min_headcount, target_headcount, required_lead_count, priority, notes]
      - name: read
        type: read
        primary: true
      - name: destroy
        type: destroy
        primary: true
    validations:
      - rule: present
        field: requirement_date
        on: [create]
      - rule: present
        field: role_code
        on: [create]

  # authorization_plan:
  #   status: planned
  #   mode: authz_domain
  #   data_scope: org_scope
  #   capabilities:
  #     - scheduling_manage: [create, update, publish_version, archive_version, destroy]
  #     - scheduling_view: [read]
  #   notes: 护长可发布/归档版本，本科室人员可查看
  - name: ScheduleVersion
    description: 一个周期内的工作版本或已发布版本
    aggregate_root: false
    read_filters:
      - name: by_period
        description: 按排班周期筛选版本
        filter:
          period_id: :period_id
      - name: by_period_and_status
        description: 按排班周期和状态筛选版本
        filter:
          period_id: :period_id
          status: :status
      - name: published_versions
        description: 只返回已发布版本
        filter:
          status: published
    attributes:
      - name: id
        type: uuid
        primary_key: true
        generated: true
      - name: version_no
        type: integer
        required: true
        description: 版本号
      - name: status
        type: enum
        required: true
        default: working
        constraints:
          values: [working, published, archived]
        description: 版本状态
      - name: origin_type
        type: enum
        required: true
        default: manual
        constraints:
          values: [manual, solver, cloned_from_previous]
        description: 版本来源类型
      - name: created_by
        type: uuid
        description: 操作者
      - name: change_summary
        type: text
        description: 版本说明
      - name: inserted_at
        type: datetime
        generated: true
      - name: updated_at
        type: datetime
        generated: true
    relationships:
      - name: period
        type: belongs_to
        target: SchedulingPeriod
        foreign_key: period_id
        required: true
      - name: based_on_run
        type: belongs_to
        target: SolverRun
        foreign_key: based_on_run_id
        description: 基于哪次求解生成
      - name: source_version
        type: belongs_to
        target: ScheduleVersion
        foreign_key: source_version_id
        description: 复制来源版本（从上一期版本克隆时指向）
      - name: shift_assignments
        type: has_many
        target: ShiftAssignment
        foreign_key: version_id
      - name: constraint_violations
        type: has_many
        target: ConstraintViolation
        foreign_key: version_id
    identities:
      - name: unique_period_version_no
        keys: [period_id, version_no]
    actions:
      - name: create
        type: create
        primary: true
        accept: [period_id, version_no, origin_type, created_by, based_on_run_id, source_version_id, change_summary]
      - name: update
        type: update
        primary: true
        accept: [change_summary]
      - name: read
        type: read
        primary: true
      - name: publish_version
        type: update
        description: 发布此版本
        accept: []
        changes:
          - effect: invoke
            target: SchedulingBridge
            method: publish_schedule_version
          - effect: set_attribute
            field: status
            value: published
      - name: archive_version
        type: update
        description: 归档此版本
        accept: []
        changes:
          - effect: set_attribute
            field: status
            value: archived
      - name: destroy
        type: destroy
    validations:
      - rule: one_of
        field: status
        params: {values: [working]}
        on: [publish_version]
        message: 只有工作中的版本可以发布
      - rule: one_of
        field: status
        params: {values: [working, published]}
        on: [archive_version]
        message: 只有工作中或已发布的版本可以归档
    events:
      - on: publish_version
        topic: scheduling.version.published
      - on: archive_version
        topic: scheduling.version.archived

  # authorization_plan:
  #   status: planned
  #   mode: authz_domain
  #   data_scope: org_scope
  #   capabilities:
  #     - scheduling_manage: [create, update, destroy, lock, unlock]
  #     - scheduling_view: [read]
  #   notes: 护长可分配/锁定/解锁排班，护士可查看自己的排班
  - name: ShiftAssignment
    description: 把某个覆盖需求分配给具体护士和时段
    aggregate_root: false
    read_filters:
      - name: by_version
        description: 按版本筛选排班分配（高频查询）
        filter:
          version_id: :version_id
      - name: by_period
        description: 按排班周期筛选分配
        filter:
          period_id: :period_id
      - name: by_version_and_employee
        description: 按版本和护士筛选分配
        filter:
          version_id: :version_id
          employee_id: :employee_id
      - name: by_version_and_requirement
        description: 按版本和需求筛选分配
        filter:
          version_id: :version_id
          requirement_id: :requirement_id
      - name: locked_assignments
        description: 只返回锁定的分配
        filter:
          version_id: :version_id
          is_locked: true
    attributes:
      - name: id
        type: uuid
        primary_key: true
        generated: true
      - name: starts_at
        type: datetime
        required: true
        description: 开始时间（UTC）
      - name: ends_at
        type: datetime
        required: true
        description: 结束时间（UTC）
      - name: source
        type: enum
        required: true
        default: auto
        constraints:
          values: [auto, manual, swapped, copied]
        description: 分配来源（copied = 从上一期复制）
      - name: is_locked
        type: boolean
        required: true
        default: false
        description: 锁定后重排不动
      - name: notes
        type: text
        description: 人工调班说明
      - name: inserted_at
        type: datetime
        generated: true
      - name: updated_at
        type: datetime
        generated: true
    relationships:
      - name: period
        type: belongs_to
        target: SchedulingPeriod
        foreign_key: period_id
        required: true
      - name: requirement
        type: belongs_to
        target: CoverageRequirement
        foreign_key: requirement_id
        required: true
      - name: version
        type: belongs_to
        target: ScheduleVersion
        foreign_key: version_id
        required: true
      - name: employee
        type: belongs_to
        target: Employee
        foreign_key: employee_id
        required: true
        description: 被排班的护士
      - name: baseline_run
        type: belongs_to
        target: SolverRun
        foreign_key: baseline_run_id
        description: 首次生成此分配的求解运行
      - name: constraint_violations
        type: has_many
        target: ConstraintViolation
        foreign_key: assignment_id
    identities:
      - name: unique_period_employee_start
        keys: [period_id, employee_id, starts_at]
      - name: unique_version_req_employee_start
        keys: [version_id, requirement_id, employee_id, starts_at]
    actions:
      - name: create
        type: create
        primary: true
        accept: [starts_at, ends_at, source, is_locked, notes]
      - name: update
        type: update
        primary: true
        accept: [starts_at, ends_at, source, is_locked, notes]
      - name: read
        type: read
        primary: true
      - name: destroy
        type: destroy
        primary: true
      - name: lock
        type: update
        description: 锁定此排班，重排时不会变动
        accept: []
        changes:
          - effect: set_attribute
            field: is_locked
            value: true
      - name: unlock
        type: update
        description: 解锁此排班
        accept: []
        changes:
          - effect: set_attribute
            field: is_locked
            value: false
    validations:
      - rule: compare
        field: ends_at
        params: {greater_than: starts_at}
        message: 结束时间必须晚于开始时间
    events:
      - on: create
        topic: scheduling.assignment.created
      - on: lock
        topic: scheduling.assignment.locked
      - on: unlock
        topic: scheduling.assignment.unlocked

  # authorization_plan:
  #   status: planned
  #   mode: authz_domain
  #   data_scope: org_scope
  #   capabilities:
  #     - scheduling_admin: [create, update, destroy]
  #     - scheduling_view: [read]
  #   notes: 管理员配置约束规则，本科室可查看
  - name: SchedulingConstraint
    description: 合法性约束和评分规则定义，不承载需求人数
    aggregate_root: true
    read_filters:
      - name: by_department
        description: 按科室筛选约束规则
        filter:
          department_id: :department_id
      - name: by_department_and_type
        description: 按科室和约束类型筛选
        filter:
          department_id: :department_id
          constraint_type: :constraint_type
      - name: enabled_only
        description: 按科室筛选且只返回启用的约束规则
        filter:
          department_id: :department_id
          enabled: true
    attributes:
      - name: id
        type: uuid
        primary_key: true
        generated: true
      - name: name
        type: string
        required: true
        description: 规则名称
      - name: constraint_type
        type: enum
        required: true
        constraints:
          values: [hard, soft]
        description: 硬约束或软约束
      - name: category
        type: enum
        required: true
        constraints:
          values:
            - rest_after_night
            - max_consecutive_days
            - respect_leave
            - skill_requirement
            - max_monthly_hours
            - lead_coverage
            - fair_night_distribution
            - fair_weekend_distribution
            - respect_preference
            - limit_consecutive_nights
            - shift_continuity
        description: 规则类别
      - name: params
        type: jsonb
        required: true
        default: {}
        description: 规则参数（shape 按 category 不同）
      - name: weight
        type: integer
        default: 50
        description: 软约束权重（硬约束忽略）
      - name: enabled
        type: boolean
        required: true
        default: true
        description: 是否启用
      - name: notes
        type: text
        description: 备注
      - name: inserted_at
        type: datetime
        generated: true
      - name: updated_at
        type: datetime
        generated: true
    relationships:
      - name: department
        type: belongs_to
        target: Department
        foreign_key: department_id
        required: true
        description: 归属科室
    actions:
      - name: create
        type: create
        primary: true
        accept: [name, constraint_type, category, params, weight, enabled, notes]
      - name: update
        type: update
        primary: true
        accept: [name, params, weight, enabled, notes]
      - name: read
        type: read
        primary: true
      - name: destroy
        type: destroy
        primary: true
    validations:
      - rule: present
        field: name
        on: [create]
      - rule: present
        field: category
        on: [create]

