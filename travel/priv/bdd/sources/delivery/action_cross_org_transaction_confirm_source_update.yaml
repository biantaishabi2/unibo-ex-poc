source_summary: GIVEN 实体 CrossOrgTransaction 的动作 confirm_source 可执行，accept=[[]]，args=[无显式参数] / WHEN 执行动作 confirm_source / THEN 输入应满足校验规则，状态变更与副作用应生效，应触发关联事件，应符合工作流步骤约束 / 补充场景：create 建立跨组织事务 -> confirm_source 确认源销售单 -> create_mirror_purchase_order 生成镜像采购单 -> mark_fulfilled 完成履约 -> mark_settled 完成结算；confirm_source 后 create_mirror_purchase_order 失败 -> mark_failed 记录 mirror_failure_reason
