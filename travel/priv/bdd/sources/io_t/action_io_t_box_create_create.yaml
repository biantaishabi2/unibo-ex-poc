source_summary: GIVEN 实体 IoTBox 的动作 create 可执行，accept=[name, ip_address, identifier, firmware_version, connection_type, auto_update, network_info, org_id]，args=[无显式参数] / WHEN 执行动作 create / THEN 输入应满足校验规则，状态变更与副作用应生效，应触发关联事件，应符合工作流步骤约束 / 补充场景：create -> register_box -> heartbeat -> update；配对成功通知；离线告警；box 离线时批量更新设备状态；定时检测超时 box
