# 出行人管理页
version: "1.0"
page:
  name: traveler_management
  title: 出行人管理
  page_type: composition
  audience: user
  entity: TravelerProfile
  route: /travel/travelers

  layout:
    - type: Stack
      gap: 0
      children:
        # 顶部导航
        - type: Header
          bind:
            back: true
            title: "出行人管理"

        - type: Stack
          gap: 3
          props:
            padding: 3
          children:
            # ========== 页面标题 + 新增按钮 ==========
            - type: Flex
              props:
                justify: space-between
                align: center
              children:
                - type: Text
                  bind:
                    value: "出行人管理"
                  props:
                    variant: h3
                    weight: bold
                - type: Button
                  bind:
                    label: "新增出行人"
                    variant: primary
                    icon: plus
                  props:
                    size: sm
                  action: open_dialog
                  params:
                    dialog: traveler_edit_dialog
                    mode: create

            # ========== 出行人列表 ==========
            - type: Stack
              gap: 2
              children_from:
                source: travelers.data
                template:
                  type: Card
                  bind:
                    key: item.id
                  slots:
                    content:
                      - type: Flex
                        props:
                          justify: space-between
                          align: center
                        children:
                          - type: Flex
                            gap: 2
                            props:
                              align: center
                            children:
                              - type: Avatar
                                bind:
                                  fallback: item.full_name
                                props:
                                  size: sm
                              - type: Stack
                                gap: 0
                                children:
                                  - type: Flex
                                    gap: 1
                                    props:
                                      align: center
                                    children:
                                      - type: Text
                                        bind:
                                          value: item.full_name
                                        props:
                                          variant: body
                                          weight: bold
                                      - type: Badge
                                        bind:
                                          label: "本人"
                                          variant: secondary
                                        visible_when:
                                          field: item.is_self
                                          op: eq
                                          value: true
                                  - type: Flex
                                    gap: 2
                                    children:
                                      - type: Text
                                        bind:
                                          value: item.id_type
                                        props:
                                          variant: caption
                                          color: muted
                                      - type: Text
                                        bind:
                                          value: item.id_number
                                        props:
                                          variant: caption
                                          color: muted
                                  - type: Text
                                    bind:
                                      value: item.phone
                                    props:
                                      variant: caption
                                      color: muted
                          - type: Flex
                            gap: 1
                            children:
                              - type: Button
                                bind:
                                  label: ""
                                  variant: ghost
                                  icon: edit
                                props:
                                  size: sm
                                action: open_dialog
                                params:
                                  dialog: traveler_edit_dialog
                                  mode: edit
                                  traveler_id: item.id
                              - type: Button
                                bind:
                                  label: ""
                                  variant: ghost
                                  icon: trash
                                props:
                                  size: sm
                                  color: destructive
                                action: delete
                                params:
                                  resource: Travel.TravelerProfile
                                  id: item.id
                                  confirm: "确定要删除该出行人吗？"

            # ========== 空状态 ==========
            - type: EmptyState
              props:
                title: "暂无出行人"
                description: "添加常用出行人，预订时可快速选择"
                icon: users
              visible_when:
                field: travelers.total_count
                op: eq
                value: 0

            # ========== 编辑/新增弹窗 ==========
            - type: Dialog
              props:
                id: traveler_edit_dialog
                title: "编辑出行人"
              children:
                - type: Stack
                  gap: 3
                  children:
                    - type: Input
                      bind:
                        label: "姓名"
                        placeholder: "请输入真实姓名"
                        value: form.full_name
                      props:
                        required: true

                    - type: Select
                      bind:
                        label: "证件类型"
                        placeholder: "请选择证件类型"
                        value: form.id_type
                        options:
                          - { label: "身份证", value: id_card }
                          - { label: "护照", value: passport }
                          - { label: "港澳通行证", value: hk_mo_pass }
                          - { label: "台湾通行证", value: tw_pass }
                      props:
                        required: true

                    - type: Input
                      bind:
                        label: "证件号码"
                        placeholder: "请输入证件号码"
                        value: form.id_number
                      props:
                        required: true

                    - type: Input
                      bind:
                        label: "手机号码"
                        placeholder: "请输入手机号码"
                        value: form.phone
                        input_type: tel

                    - type: Input
                      bind:
                        label: "邮箱"
                        placeholder: "请输入邮箱地址"
                        value: form.email
                        input_type: email

                    - type: Flex
                      props:
                        justify: space-between
                        align: center
                      children:
                        - type: Text
                          bind:
                            value: "是否本人"
                        - type: Switch
                          bind:
                            value: form.is_self

                    - type: Flex
                      gap: 2
                      props:
                        justify: flex-end
                      children:
                        - type: Button
                          bind:
                            label: "取消"
                            variant: outline
                          action: close_dialog
                          params:
                            dialog: traveler_edit_dialog
                        - type: Button
                          bind:
                            label: "保存"
                            variant: primary
                          action: submit_form
                          params:
                            resource: Travel.TravelerProfile

  data_sources:
    - name: travelers
      type: list
      resource: Travel.TravelerProfile
      filters:
        - field: tenant_id
          op: eq
          value: actor.tenant_id
      sort:
        - field: is_self
          direction: desc
        - field: inserted_at
          direction: desc

  permissions:
    access: authenticated
    data_scope:
      field: tenant_id
      eq: actor.tenant_id
