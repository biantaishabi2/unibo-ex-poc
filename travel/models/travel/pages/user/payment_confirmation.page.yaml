# 支付确认页
version: "1.0"
page:
  name: payment_confirmation
  title: 支付确认
  page_type: composition
  audience: user
  entity: TravelOrder
  route: /travel/payment/:order_id

  layout:
    - type: Stack
      gap: 0
      children:
        # 顶部导航
        - type: Header
          bind:
            back: true
            title: "支付确认"

        - type: Stack
          gap: 3
          props:
            padding: 3
          children:
            # ========== 支付状态区域 ==========
            - type: Card
              slots:
                content:
                  - type: Stack
                    gap: 2
                    props:
                      align: center
                      padding: 4
                    children:
                      # 支付成功
                      - type: Icon
                        bind:
                          name: check-circle
                        props:
                          size: lg
                          color: success
                        visible_when:
                          field: order.payment.status
                          op: eq
                          value: completed
                      - type: Text
                        bind:
                          value: "支付成功"
                        props:
                          variant: h2
                          weight: bold
                        visible_when:
                          field: order.payment.status
                          op: eq
                          value: completed
                      # 支付处理中
                      - type: Icon
                        bind:
                          name: clock
                        props:
                          size: lg
                          color: warning
                        visible_when:
                          field: order.payment.status
                          op: eq
                          value: pending
                      - type: Text
                        bind:
                          value: "支付处理中"
                        props:
                          variant: h2
                          weight: bold
                        visible_when:
                          field: order.payment.status
                          op: eq
                          value: pending
                      # 支付失败
                      - type: Icon
                        bind:
                          name: x-circle
                        props:
                          size: lg
                          color: destructive
                        visible_when:
                          field: order.payment.status
                          op: eq
                          value: failed
                      - type: Text
                        bind:
                          value: "支付失败"
                        props:
                          variant: h2
                          weight: bold
                        visible_when:
                          field: order.payment.status
                          op: eq
                          value: failed
                      - type: Text
                        bind:
                          value: "请重试或选择其他支付方式"
                        props:
                          variant: caption
                          color: muted
                        visible_when:
                          field: order.payment.status
                          op: eq
                          value: failed

            # ========== 支付方式 Card ==========
            - type: Card
              slots:
                header:
                  - type: Text
                    bind:
                      value: "支付方式"
                    props:
                      variant: h4
                      weight: bold
                content:
                  - type: Flex
                    props:
                      justify: space-between
                      align: center
                    children:
                      - type: Flex
                        gap: 2
                        props:
                          align: center
                        children:
                          - type: Icon
                            bind:
                              name: building
                            props:
                              size: sm
                          - type: Text
                            bind:
                              value: "公司支付"
                      - type: Badge
                        bind:
                          label: order.payment.payment_method
                          variant: secondary

            # ========== 金额明细 Card ==========
            - type: Card
              slots:
                header:
                  - type: Text
                    bind:
                      value: "费用明细"
                    props:
                      variant: h4
                      weight: bold
                content:
                  - type: Stack
                    gap: 2
                    children:
                      - type: Flex
                        props:
                          justify: space-between
                        children:
                          - type: Text
                            bind:
                              value: "订单金额"
                            props:
                              variant: caption
                              color: muted
                          - type: Text
                            bind:
                              value: order.total_amount
                      - type: Flex
                        props:
                          justify: space-between
                        children:
                          - type: Text
                            bind:
                              value: "积分抵扣"
                            props:
                              variant: caption
                              color: muted
                          - type: Text
                            bind:
                              value: order.points_deduction_amount
                            props:
                              color: success
                        visible_when:
                          field: order.points_to_use
                          op: gt
                          value: 0
                      - type: Separator
                      - type: Flex
                        props:
                          justify: space-between
                        children:
                          - type: Text
                            bind:
                              value: "实付金额"
                            props:
                              variant: body
                              weight: bold
                          - type: Text
                            bind:
                              value: order.payable_amount
                            props:
                              variant: h3
                              color: primary
                      - type: Separator
                      - type: Flex
                        props:
                          justify: space-between
                        children:
                          - type: Text
                            bind:
                              value: "币种"
                            props:
                              variant: caption
                              color: muted
                          - type: Text
                            bind:
                              value: order.currency

            # ========== 支付时间信息 Card ==========
            - type: Card
              visible_when:
                field: order.payment.status
                op: eq
                value: completed
              slots:
                header:
                  - type: Text
                    bind:
                      value: "支付信息"
                    props:
                      variant: h4
                      weight: bold
                content:
                  - type: Stack
                    gap: 2
                    children:
                      - type: Flex
                        props:
                          justify: space-between
                        children:
                          - type: Text
                            bind:
                              value: "支付单号"
                            props:
                              variant: caption
                              color: muted
                          - type: Text
                            bind:
                              value: order.payment.payment_no
                      - type: Flex
                        props:
                          justify: space-between
                        children:
                          - type: Text
                            bind:
                              value: "支付时间"
                            props:
                              variant: caption
                              color: muted
                          - type: Text
                            bind:
                              value: order.payment.paid_at

        # ========== 操作栏 ==========
        - type: ControlBar
          position: sticky_bottom
          children:
            - type: Button
              bind:
                label: "查看订单"
                variant: primary
              props:
                size: lg
              action: navigate
              params:
                to: /travel/orders/{{ order.id }}
            - type: Button
              bind:
                label: "回到首页"
                variant: outline
              props:
                size: lg
              action: navigate
              params:
                to: /travel
            - type: Button
              bind:
                label: "重新支付"
                variant: destructive
              props:
                size: lg
              visible_when:
                field: order.payment.status
                op: eq
                value: failed

  data_sources:
    - name: order
      type: read
      resource: Travel.TravelOrder
      params:
        id: route.order_id
      load:
        - payment

  permissions:
    access: authenticated
    data_scope:
      field: tenant_id
      eq: actor.tenant_id
