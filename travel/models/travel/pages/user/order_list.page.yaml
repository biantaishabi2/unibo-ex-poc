# 旅行订单列表页
version: "1.0"
page:
  name: order_list
  title: 我的行程
  page_type: composition
  audience: user
  entity: TravelOrder
  route: /travel/orders

  layout:
    - type: Stack
      gap: 0
      children:
        # 顶部导航
        - type: Header
          bind:
            title: "我的行程"

        # 顶部产品类型筛选 Tabs
        - type: Tabs
          bind:
            default_value: all
            value: filters.product_type_tab
          children:
            - type: Text
              props:
                tab_key: all
                tab_label: 全部
            - type: Text
              props:
                tab_key: flight
                tab_label: 机票
            - type: Text
              props:
                tab_key: hotel
                tab_label: 酒店
            - type: Text
              props:
                tab_key: train
                tab_label: 火车
            - type: Text
              props:
                tab_key: car
                tab_label: 用车

        # 订单列表
        - type: Stack
          gap: 2
          props:
            padding: 3
          children_from:
            source: orders.data
            template:
              type: Card
              bind:
                key: item.id
              action: navigate
              params:
                to: /travel/orders/{{ item.id }}
              slots:
                header:
                  - type: Flex
                    props:
                      justify: space-between
                      align: center
                    children:
                      - type: Flex
                        gap: 2
                        props:
                          align: center
                        children:
                          - type: Icon
                            bind:
                              name: plane
                            visible_when:
                              field: item.product_type
                              op: eq
                              value: flight
                          - type: Icon
                            bind:
                              name: building
                            visible_when:
                              field: item.product_type
                              op: eq
                              value: hotel
                          - type: Icon
                            bind:
                              name: train
                            visible_when:
                              field: item.product_type
                              op: eq
                              value: train
                          - type: Icon
                            bind:
                              name: car
                            visible_when:
                              field: item.product_type
                              op: eq
                              value: vacation
                          - type: Badge
                            bind:
                              label: item.product_type
                              variant: secondary
                      - type: Badge
                        bind:
                          label: item.status
                          variant: outline

                content:
                  - type: Stack
                    gap: 2
                    children:
                      # 机票摘要: 航线信息
                      - type: Text
                        bind:
                          value: item.flight_offer.summary
                        props:
                          variant: body
                          weight: bold
                        visible_when:
                          field: item.product_type
                          op: eq
                          value: flight
                      # 酒店摘要: 酒店名称
                      - type: Text
                        bind:
                          value: item.hotel_offer.hotel_name
                        props:
                          variant: body
                          weight: bold
                        visible_when:
                          field: item.product_type
                          op: eq
                          value: hotel
                      # 火车摘要: 车次信息
                      - type: Text
                        bind:
                          value: item.train_offer.summary
                        props:
                          variant: body
                          weight: bold
                        visible_when:
                          field: item.product_type
                          op: eq
                          value: train
                      # 订单号
                      - type: Text
                        bind:
                          value: item.order_no
                        props:
                          variant: caption
                          color: muted
                      # 标签行: 企业支付/因公/退
                      - type: Flex
                        gap: 1
                        props:
                          wrap: true
                        children:
                          - type: Badge
                            bind:
                              label: "企业支付"
                              variant: secondary
                          - type: Badge
                            bind:
                              label: item.travel_purpose
                              variant: secondary
                            visible_when:
                              field: item.travel_purpose
                              op: not_null
                          - type: Badge
                            bind:
                              label: "退"
                              variant: destructive
                            visible_when:
                              field: item.change_status
                              op: in
                              value:
                                - pending
                                - changed

                footer:
                  - type: Flex
                    props:
                      justify: space-between
                      align: center
                    children:
                      - type: Text
                        bind:
                          value: item.total_amount
                        props:
                          variant: h3
                      - type: Button
                        bind:
                          label: ""
                          variant: ghost
                          icon: trash
                        props:
                          size: sm
                        visible_when:
                          field: item.status
                          op: in
                          value:
                            - completed
                            - cancelled

        # 空状态
        - type: EmptyState
          props:
            title: "暂无行程订单"
            description: "您还没有预订任何行程"
            icon: plane
          visible_when:
            field: orders.total_count
            op: eq
            value: 0

  data_sources:
    - name: orders
      type: list
      resource: Travel.TravelOrder
      sort:
        - field: inserted_at
          direction: desc
      filters:
        - field: tenant_id
          op: eq
          value: actor.tenant_id

  permissions:
    access: authenticated
    data_scope:
      field: tenant_id
      eq: actor.tenant_id
