# 火车票车次详情页
# 场景：查看车次详细信息和席别列表，选择席别预订
# 特征：航线摘要头+车次信息卡+席别列表（价格/余票/差标）+预订按钮
version: "1.0"
page:
  name: train_detail
  title: 车次详情
  page_type: composition
  audience: user
  entity: TrainOffer
  route: /travel/train/:offer_id

  layout:
    - type: Stack
      gap: 0
      children:
        # 顶部导航
        - type: Header
          bind:
            back: true
            title: offer.train_no

        # 路线摘要头
        - type: Stack
          gap: 3
          props:
            padding: 4
            background: primary
          children:
            - type: Flex
              props:
                justify: space-between
                align: center
              children:
                # 出发
                - type: Stack
                  gap: 0
                  props:
                    align: center
                  children:
                    - type: Text
                      bind:
                        value: offer.departure_time
                      props:
                        variant: h1
                        weight: bold
                        color: white
                    - type: Text
                      bind:
                        value: offer.departure_station_name
                      props:
                        variant: body
                        color: white
                # 中间运行信息
                - type: Stack
                  gap: 0
                  props:
                    align: center
                  children:
                    - type: Text
                      bind:
                        value: offer.duration_label
                      props:
                        variant: caption
                        color: white
                    - type: Icon
                      bind:
                        name: arrow-right
                      props:
                        color: white
                    - type: Text
                      bind:
                        value: offer.date_label
                      props:
                        variant: caption
                        color: white
                # 到达
                - type: Stack
                  gap: 0
                  props:
                    align: center
                  children:
                    - type: Text
                      bind:
                        value: offer.arrival_time
                      props:
                        variant: h1
                        weight: bold
                        color: white
                    - type: Text
                      bind:
                        value: offer.arrival_station_name
                      props:
                        variant: body
                        color: white

        # 车次详细信息
        - type: Card
          slots:
            header:
              - type: Text
                bind:
                  value: "车次信息"
                props:
                  variant: h4
                  weight: bold
            content:
              - type: Grid
                columns: 2
                gap: 3
                children:
                  - type: Statistic
                    bind:
                      title: "车次号"
                      value: offer.train_no
                  - type: Statistic
                    bind:
                      title: "车次类型"
                      value: offer.train_type_label
                  - type: Statistic
                    bind:
                      title: "出发站"
                      value: offer.departure_station_name
                  - type: Statistic
                    bind:
                      title: "到达站"
                      value: offer.arrival_station_name

        - type: Separator

        # 席别列表标题
        - type: Text
          bind:
            value: "选择席别"
          props:
            variant: h3
            padding: 3

        # 席别列表
        - type: Stack
          gap: 2
          props:
            padding: 3
          children_from:
            source: offer.seat_options
            template:
              type: Card
              slots:
                content:
                  - type: Flex
                    props:
                      justify: space-between
                      align: center
                    children:
                      - type: Stack
                        gap: 1
                        children:
                          - type: Flex
                            gap: 2
                            props:
                              align: center
                            children:
                              - type: Text
                                bind:
                                  value: item.seat_class_name
                                props:
                                  variant: body
                                  weight: bold
                              - type: Badge
                                visible_when:
                                  field: item.is_policy_compliant
                                  op: eq
                                  value: false
                                bind:
                                  label: "超标"
                                  variant: destructive
                          - type: Text
                            bind:
                              value: item.tickets_label
                            props:
                              variant: caption
                              color: muted
                      - type: Stack
                        gap: 1
                        props:
                          align: flex-end
                        children:
                          - type: Flex
                            gap: 1
                            props:
                              align: baseline
                            children:
                              - type: Text
                                bind:
                                  value: item.currency
                                props:
                                  variant: caption
                              - type: Text
                                bind:
                                  value: item.price
                                props:
                                  variant: h3
                                  color: primary
                          - type: Button
                            bind:
                              label: "预订"
                              variant: primary
                            props:
                              size: sm
                            action: navigate
                            params:
                              to: /travel/train/booking/{item.offer_id}

  data_sources:
    - name: offer
      type: read
      entity: TrainOffer
      params:
        id: route.offer_id

  permissions:
    access: authenticated
    data_scope:
      field: tenant_id
      eq: actor.tenant_id
