# 机票搜索结果页
# 场景：按条件搜索航班列表，支持日期横滑、筛选、排序
# 特征：日期横滑+筛选栏+航班卡片列表+底部排序栏
version: "1.0"
page:
  name: flight_search_results
  title: 机票搜索
  page_type: composition
  audience: user
  entity: FlightOffer
  route: /travel/flight/search

  layout:
    - type: Stack
      gap: 0
      children:
        # 顶部导航
        - type: Header
          bind:
            back: true
            title: "机票搜索"
            subtitle: search.route_label

        # 日期横滑条
        - type: Flex
          gap: 2
          props:
            padding_x: 3
            padding_y: 2
            overflow_x: scroll
            background: surface
          children_from:
            source: search.date_range
            template:
              type: Badge
              bind:
                label: item.date_label
                sublabel: item.price_label
                variant: item.is_selected
              action: select_date
              params:
                date: item.date

        - type: Separator

        # 筛选栏
        - type: Flex
          gap: 2
          props:
            padding_x: 3
            padding_y: 2
            wrap: true
          children:
            - type: Select
              bind:
                label: "出发机场"
                value: filter.departure_airport
            - type: Select
              bind:
                label: "到达机场"
                value: filter.arrival_airport
            - type: Select
              bind:
                label: "航空公司"
                value: filter.airline
            - type: Select
              bind:
                label: "差标"
                value: filter.policy_compliant
                options:
                  - { label: "不限", value: all }
                  - { label: "符合差标", value: compliant }
            - type: Select
              bind:
                label: "舱位"
                value: filter.cabin_class
                options:
                  - { label: "不限", value: all }
                  - { label: "经济舱", value: economy }
                  - { label: "公务舱", value: business }
                  - { label: "头等舱", value: first }

        # 超标提示
        - type: Alert
          visible_when:
            field: policy.exceeded
            op: eq
            value: true
          bind:
            variant: warning
            title: "超标提示"
            description: "标记超标的航班超出差旅标准，预订需审批"

        # 航班卡片列表
        - type: Stack
          gap: 3
          props:
            padding: 3
          children_from:
            source: flights.items
            template:
              type: Card
              slots:
                header:
                  - type: Flex
                    gap: 2
                    props:
                      align: center
                    children:
                      - type: Avatar
                        bind:
                          src: item.airline_ref.logo
                          fallback: item.airline_ref.code
                        props:
                          size: sm
                      - type: Text
                        bind:
                          value: item.airline_ref.name
                        props:
                          variant: caption
                          color: muted
                      - type: Text
                        bind:
                          value: item.flight_no
                        props:
                          variant: caption
                          color: muted
                      - type: Badge
                        visible_when:
                          field: item.is_policy_compliant
                          op: eq
                          value: false
                        bind:
                          label: "超标"
                          variant: destructive
                content:
                  - type: Flex
                    props:
                      justify: space-between
                      align: center
                    children:
                      # 出发信息
                      - type: Stack
                        gap: 0
                        props:
                          align: center
                        children:
                          - type: Text
                            bind:
                              value: item.departure_time
                            props:
                              variant: h2
                              weight: bold
                          - type: Text
                            bind:
                              value: item.departure_airport_ref.city_name
                            props:
                              variant: caption
                              color: muted
                          - type: Text
                            bind:
                              value: item.departure_airport_code
                            props:
                              variant: caption
                              color: muted
                      # 飞行信息
                      - type: Stack
                        gap: 0
                        props:
                          align: center
                        children:
                          - type: Text
                            bind:
                              value: item.duration_label
                            props:
                              variant: caption
                              color: muted
                          - type: Separator
                          - type: Text
                            bind:
                              value: item.stop_label
                            props:
                              variant: caption
                              color: muted
                      # 到达信息
                      - type: Stack
                        gap: 0
                        props:
                          align: center
                        children:
                          - type: Text
                            bind:
                              value: item.arrival_time
                            props:
                              variant: h2
                              weight: bold
                          - type: Text
                            bind:
                              value: item.arrival_airport_ref.city_name
                            props:
                              variant: caption
                              color: muted
                          - type: Text
                            bind:
                              value: item.arrival_airport_code
                            props:
                              variant: caption
                              color: muted
                footer:
                  - type: Flex
                    props:
                      justify: space-between
                      align: center
                    children:
                      - type: Flex
                        gap: 1
                        props:
                          wrap: true
                        children:
                          - type: Badge
                            bind:
                              label: item.cabin_class_ref.name
                              variant: outline
                          - type: Badge
                            bind:
                              label: item.aircraft_type
                              variant: outline
                          - type: Badge
                            visible_when:
                              field: item.discount_label
                              op: not_null
                            bind:
                              label: item.discount_label
                              variant: success
                      - type: Flex
                        gap: 1
                        props:
                          align: baseline
                        children:
                          - type: Text
                            bind:
                              value: item.currency
                            props:
                              variant: caption
                          - type: Text
                            bind:
                              value: item.listed_price
                            props:
                              variant: h3
                              color: primary
              action: navigate
              params:
                to: /travel/flight/{item.id}

        # 空状态
        - type: EmptyState
          visible_when:
            field: flights.total_count
            op: eq
            value: 0
          bind:
            title: "未找到航班"
            description: "请调整搜索条件后重试"
            icon: plane

        # 底部排序栏
        - type: ControlBar
          position: sticky_bottom
          children:
            - type: Flex
              gap: 3
              props:
                justify: space-around
                width: full
              children:
                - type: Button
                  bind:
                    label: "价格"
                    variant: ghost
                    icon: arrow-up-down
                  action: sort
                  params:
                    field: listed_price
                - type: Button
                  bind:
                    label: "出发时间"
                    variant: ghost
                    icon: arrow-up-down
                  action: sort
                  params:
                    field: departure_at
                - type: Button
                  bind:
                    label: "推荐"
                    variant: ghost
                    icon: star
                  action: sort
                  params:
                    field: recommended

  data_sources:
    - name: flights
      type: list
      entity: FlightOffer
      params:
        departure_airport_code: route.departure
        arrival_airport_code: route.arrival
        departure_date: route.date
    - name: policy
      type: read
      entity: TravelPolicy
      params:
        tenant_id: actor.tenant_id

  permissions:
    access: authenticated
    data_scope:
      field: tenant_id
      eq: actor.tenant_id
