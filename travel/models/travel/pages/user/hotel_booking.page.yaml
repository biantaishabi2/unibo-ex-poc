# 酒店预订页
# 场景：填写入住信息、联系人、支付方式并提交预订
# 特征：房型摘要+订房信息+联系人+支付+底部提交栏
version: "1.0"
page:
  name: hotel_booking
  title: 酒店预订
  page_type: composition
  audience: user
  entity: HotelOffer
  route: /travel/hotel/booking/:offer_id

  layout:
    - type: Stack
      gap: 0
      children:
        # 顶部导航
        - type: Header
          bind:
            back: true
            title: "填写订单"

        - type: Stack
          gap: 3
          props:
            padding: 3
          children:
            # 房型摘要卡片
            - type: Card
              slots:
                header:
                  - type: Text
                    bind:
                      value: "房型信息"
                    props:
                      variant: h4
                      weight: bold
                content:
                  - type: Stack
                    gap: 2
                    children:
                      - type: Text
                        bind:
                          value: offer.hotel_name
                        props:
                          variant: h3
                          weight: bold
                      - type: Flex
                        gap: 2
                        props:
                          align: center
                        children:
                          - type: Badge
                            bind:
                              label: offer.room_type_ref.room_type_name
                              variant: secondary
                          - type: Badge
                            bind:
                              label: offer.room_type_ref.bed_type
                              variant: outline
                      - type: Flex
                        gap: 2
                        children:
                          - type: Statistic
                            bind:
                              title: "入住"
                              value: offer.checkin_date
                          - type: Statistic
                            bind:
                              title: "退房"
                              value: offer.checkout_date
                      - type: Flex
                        gap: 1
                        props:
                          wrap: true
                        children:
                          - type: Badge
                            bind:
                              label: offer.cancellation_policy
                              variant: outline
                          - type: Badge
                            bind:
                              label: offer.guarantee_policy
                              variant: outline
                footer:
                  - type: Flex
                    props:
                      justify: flex-end
                      align: baseline
                    children:
                      - type: Text
                        bind:
                          value: offer.currency
                        props:
                          variant: caption
                      - type: Text
                        bind:
                          value: offer.listed_price
                        props:
                          variant: h2
                          color: primary

            # 订房信息
            - type: Card
              slots:
                header:
                  - type: Text
                    bind:
                      value: "订房信息"
                    props:
                      variant: h4
                      weight: bold
                content:
                  - type: Stack
                    gap: 3
                    children:
                      - type: Select
                        bind:
                          label: "房间数"
                          value: form.room_count
                          options:
                            - { label: "1间", value: 1 }
                            - { label: "2间", value: 2 }
                            - { label: "3间", value: 3 }
                      - type: Text
                        bind:
                          value: "入住人"
                        props:
                          variant: body
                          weight: medium
                      # 入住人列表
                      - type: Stack
                        gap: 2
                        children_from:
                          source: travelers.items
                          template:
                            type: Flex
                            gap: 2
                            props:
                              align: center
                            children:
                              - type: Checkbox
                                bind:
                                  value: item.selected
                              - type: Avatar
                                bind:
                                  src: item.avatar
                                  fallback: item.name_initial
                              - type: Stack
                                gap: 0
                                children:
                                  - type: Text
                                    bind:
                                      value: item.name
                                    props:
                                      variant: body
                                  - type: Text
                                    bind:
                                      value: item.id_number_masked
                                    props:
                                      variant: caption
                                      color: muted
                      - type: Button
                        bind:
                          label: "+ 添加入住人"
                          variant: outline
                        props:
                          size: sm
                        action: add_traveler

            # 联系人
            - type: Card
              slots:
                header:
                  - type: Text
                    bind:
                      value: "联系人"
                    props:
                      variant: h4
                      weight: bold
                content:
                  - type: Stack
                    gap: 3
                    children:
                      - type: Input
                        bind:
                          label: "联系人姓名"
                          placeholder: "请输入联系人姓名"
                          value: form.contact_name
                      - type: Input
                        bind:
                          label: "手机号"
                          placeholder: "请输入手机号"
                          value: form.contact_phone
                      - type: Input
                        bind:
                          label: "邮箱"
                          placeholder: "请输入邮箱（选填）"
                          value: form.contact_email

            # 支付方式
            - type: Card
              slots:
                header:
                  - type: Text
                    bind:
                      value: "支付方式"
                    props:
                      variant: h4
                      weight: bold
                content:
                  - type: Select
                    bind:
                      label: "选择支付方式"
                      value: form.payment_method
                      options:
                        - { label: "企业支付", value: corporate }
                        - { label: "个人支付", value: personal }

        # 底部提交栏
        - type: ControlBar
          position: sticky_bottom
          children:
            - type: Flex
              props:
                justify: space-between
                align: center
                width: full
              children:
                - type: Flex
                  gap: 1
                  props:
                    align: baseline
                  children:
                    - type: Text
                      bind:
                        value: "合计"
                      props:
                        variant: caption
                    - type: Text
                      bind:
                        value: offer.currency
                      props:
                        variant: caption
                        color: primary
                    - type: Text
                      bind:
                        value: offer.total_price
                      props:
                        variant: h2
                        color: primary
                - type: Button
                  bind:
                    label: "提交订单"
                    variant: primary
                  props:
                    size: lg
                  action: submit_booking

  data_sources:
    - name: offer
      type: read
      entity: HotelOffer
      params:
        id: route.offer_id
    - name: travelers
      type: list
      entity: TravelerProfile
      params:
        tenant_id: actor.tenant_id

  permissions:
    access: authenticated
    data_scope:
      field: tenant_id
      eq: actor.tenant_id
