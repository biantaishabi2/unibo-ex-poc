# 旅行订单详情页（按 product_type 条件渲染）
version: "1.0"
page:
  name: order_detail
  title: 订单详情
  page_type: composition
  audience: user
  entity: TravelOrder
  route: /travel/orders/:order_id

  layout:
    - type: Stack
      gap: 0
      children:
        # 顶部导航
        - type: Header
          bind:
            back: true
            title: "订单详情"

        - type: Stack
          gap: 3
          props:
            padding: 3
          children:
            # ========== 状态区域 ==========
            - type: Card
              slots:
                content:
                  - type: Flex
                    gap: 2
                    props:
                      direction: column
                      align: center
                      padding: 3
                    children:
                      - type: Icon
                        bind:
                          name: check-circle
                        props:
                          size: lg
                          color: success
                        visible_when:
                          field: order.status
                          op: in
                          value:
                            - booked
                            - completed
                      - type: Icon
                        bind:
                          name: clock
                        props:
                          size: lg
                          color: warning
                        visible_when:
                          field: order.status
                          op: in
                          value:
                            - booking_pending
                            - submitted
                            - quoted
                      - type: Icon
                        bind:
                          name: x-circle
                        props:
                          size: lg
                          color: destructive
                        visible_when:
                          field: order.status
                          op: in
                          value:
                            - cancelled
                            - failed
                      - type: Text
                        bind:
                          value: order.status
                        props:
                          variant: h2
                          weight: bold
                      - type: Text
                        bind:
                          value: "订单已完成，感谢您的使用"
                        props:
                          variant: caption
                          color: muted
                        visible_when:
                          field: order.status
                          op: eq
                          value: completed

            # ========== 订单号 + 金额 Card ==========
            - type: Card
              slots:
                header:
                  - type: Text
                    bind:
                      value: "订单信息"
                    props:
                      variant: h4
                      weight: bold
                content:
                  - type: Stack
                    gap: 2
                    children:
                      - type: Flex
                        props:
                          justify: space-between
                        children:
                          - type: Text
                            bind:
                              value: "订单号"
                            props:
                              variant: caption
                              color: muted
                          - type: Text
                            bind:
                              value: order.order_no
                      - type: Separator
                      - type: Flex
                        props:
                          justify: space-between
                        children:
                          - type: Text
                            bind:
                              value: "总金额"
                            props:
                              variant: caption
                              color: muted
                          - type: Text
                            bind:
                              value: order.total_amount
                            props:
                              variant: h3
                      - type: Flex
                        props:
                          justify: space-between
                        children:
                          - type: Text
                            bind:
                              value: "积分抵扣"
                            props:
                              variant: caption
                              color: muted
                          - type: Text
                            bind:
                              value: order.points_deduction_amount
                        visible_when:
                          field: order.points_to_use
                          op: gt
                          value: 0
                      - type: Flex
                        props:
                          justify: space-between
                        children:
                          - type: Text
                            bind:
                              value: "应付金额"
                            props:
                              variant: caption
                              color: muted
                          - type: Text
                            bind:
                              value: order.payable_amount
                            props:
                              variant: h3
                              color: primary

            # ========== 机票行程信息 Card ==========
            - type: Card
              visible_when:
                field: order.product_type
                op: eq
                value: flight
              slots:
                header:
                  - type: Text
                    bind:
                      value: "航班信息"
                    props:
                      variant: h4
                      weight: bold
                content:
                  - type: Stack
                    gap: 3
                    children:
                      # 航线时刻图
                      - type: Flex
                        props:
                          justify: space-between
                          align: center
                        children:
                          - type: Stack
                            gap: 0
                            props:
                              align: center
                            children:
                              - type: Text
                                bind:
                                  value: order.flight_offer.departure_time
                                props:
                                  variant: h2
                                  weight: bold
                              - type: Text
                                bind:
                                  value: order.flight_offer.departure_airport
                                props:
                                  variant: caption
                                  color: muted
                              - type: Text
                                bind:
                                  value: order.flight_offer.departure_terminal
                                props:
                                  variant: caption
                                  color: muted
                          - type: Stack
                            gap: 0
                            props:
                              align: center
                            children:
                              - type: Text
                                bind:
                                  value: order.flight_offer.duration
                                props:
                                  variant: caption
                                  color: muted
                              - type: Icon
                                bind:
                                  name: arrow-right
                                props:
                                  size: sm
                              - type: Text
                                bind:
                                  value: order.flight_offer.flight_no
                                props:
                                  variant: caption
                                  color: muted
                          - type: Stack
                            gap: 0
                            props:
                              align: center
                            children:
                              - type: Text
                                bind:
                                  value: order.flight_offer.arrival_time
                                props:
                                  variant: h2
                                  weight: bold
                              - type: Text
                                bind:
                                  value: order.flight_offer.arrival_airport
                                props:
                                  variant: caption
                                  color: muted
                              - type: Text
                                bind:
                                  value: order.flight_offer.arrival_terminal
                                props:
                                  variant: caption
                                  color: muted
                      - type: Separator
                      # 航司+机型+餐食
                      - type: Flex
                        gap: 2
                        props:
                          wrap: true
                        children:
                          - type: Text
                            bind:
                              value: order.flight_offer.airline_name
                            props:
                              variant: caption
                          - type: Text
                            bind:
                              value: order.flight_offer.aircraft_type
                            props:
                              variant: caption
                              color: muted
                          - type: Badge
                            bind:
                              label: order.flight_offer.meal_info
                              variant: secondary
                      - type: Separator
                      # 退改签/行李额/产品说明 折叠区
                      - type: Accordion
                        children:
                          - type: Collapsible
                            props:
                              title: "退改签规则"
                            children:
                              - type: Text
                                bind:
                                  value: order.flight_offer.refund_change_policy
                                props:
                                  variant: caption
                          - type: Collapsible
                            props:
                              title: "行李额说明"
                            children:
                              - type: Text
                                bind:
                                  value: order.flight_offer.baggage_allowance
                                props:
                                  variant: caption
                          - type: Collapsible
                            props:
                              title: "产品说明"
                            children:
                              - type: Text
                                bind:
                                  value: order.flight_offer.product_description
                                props:
                                  variant: caption

            # ========== 火车票行程信息 Card ==========
            - type: Card
              visible_when:
                field: order.product_type
                op: eq
                value: train
              slots:
                header:
                  - type: Text
                    bind:
                      value: "车次信息"
                    props:
                      variant: h4
                      weight: bold
                content:
                  - type: Stack
                    gap: 3
                    children:
                      # 取票号 + 检票口
                      - type: Flex
                        gap: 3
                        children:
                          - type: Flex
                            gap: 1
                            children:
                              - type: Text
                                bind:
                                  value: "取票号"
                                props:
                                  variant: caption
                                  color: muted
                              - type: Text
                                bind:
                                  value: order.seat_selection_snapshot.pickup_code
                                props:
                                  variant: body
                                  weight: bold
                          - type: Flex
                            gap: 1
                            children:
                              - type: Text
                                bind:
                                  value: "检票口"
                                props:
                                  variant: caption
                                  color: muted
                              - type: Text
                                bind:
                                  value: order.seat_selection_snapshot.gate
                                props:
                                  variant: body
                                  weight: bold
                      - type: Separator
                      # 车次时刻
                      - type: Flex
                        props:
                          justify: space-between
                          align: center
                        children:
                          - type: Stack
                            gap: 0
                            props:
                              align: center
                            children:
                              - type: Text
                                bind:
                                  value: order.train_offer.departure_time
                                props:
                                  variant: h2
                                  weight: bold
                              - type: Text
                                bind:
                                  value: order.train_offer.departure_station
                                props:
                                  variant: caption
                                  color: muted
                          - type: Stack
                            gap: 0
                            props:
                              align: center
                            children:
                              - type: Text
                                bind:
                                  value: order.train_offer.train_no
                                props:
                                  variant: caption
                                  weight: bold
                              - type: Icon
                                bind:
                                  name: arrow-right
                                props:
                                  size: sm
                              - type: Text
                                bind:
                                  value: order.train_offer.duration
                                props:
                                  variant: caption
                                  color: muted
                          - type: Stack
                            gap: 0
                            props:
                              align: center
                            children:
                              - type: Text
                                bind:
                                  value: order.train_offer.arrival_time
                                props:
                                  variant: h2
                                  weight: bold
                              - type: Text
                                bind:
                                  value: order.train_offer.arrival_station
                                props:
                                  variant: caption
                                  color: muted
                      - type: Separator
                      # 经停信息
                      - type: Collapsible
                        props:
                          title: "经停站信息"
                        children:
                          - type: Text
                            bind:
                              value: order.train_offer.stop_stations
                            props:
                              variant: caption

            # ========== 酒店行程信息 Card ==========
            - type: Card
              visible_when:
                field: order.product_type
                op: eq
                value: hotel
              slots:
                header:
                  - type: Text
                    bind:
                      value: "酒店信息"
                    props:
                      variant: h4
                      weight: bold
                content:
                  - type: Stack
                    gap: 3
                    children:
                      # 酒店名+地址
                      - type: Text
                        bind:
                          value: order.hotel_offer.hotel_name
                        props:
                          variant: h3
                          weight: bold
                      - type: Text
                        bind:
                          value: order.hotel_offer.address
                        props:
                          variant: caption
                          color: muted
                      - type: Separator
                      # 房型详情
                      - type: Grid
                        props:
                          columns: 2
                          gap: 2
                        children:
                          - type: Flex
                            gap: 1
                            children:
                              - type: Text
                                bind:
                                  value: "房型"
                                props:
                                  variant: caption
                                  color: muted
                              - type: Text
                                bind:
                                  value: order.hotel_offer.room_type_name
                                props:
                                  variant: caption
                          - type: Flex
                            gap: 1
                            children:
                              - type: Text
                                bind:
                                  value: "间数"
                                props:
                                  variant: caption
                                  color: muted
                              - type: Text
                                bind:
                                  value: order.hotel_offer.room_count
                                props:
                                  variant: caption
                          - type: Flex
                            gap: 1
                            children:
                              - type: Text
                                bind:
                                  value: "晚数"
                                props:
                                  variant: caption
                                  color: muted
                              - type: Text
                                bind:
                                  value: order.hotel_offer.night_count
                                props:
                                  variant: caption
                          - type: Flex
                            gap: 1
                            children:
                              - type: Text
                                bind:
                                  value: "床型"
                                props:
                                  variant: caption
                                  color: muted
                              - type: Text
                                bind:
                                  value: order.hotel_offer.bed_type
                                props:
                                  variant: caption
                          - type: Flex
                            gap: 1
                            children:
                              - type: Text
                                bind:
                                  value: "面积"
                                props:
                                  variant: caption
                                  color: muted
                              - type: Text
                                bind:
                                  value: order.hotel_offer.room_area
                                props:
                                  variant: caption
                          - type: Flex
                            gap: 1
                            children:
                              - type: Text
                                bind:
                                  value: "早餐"
                                props:
                                  variant: caption
                                  color: muted
                              - type: Text
                                bind:
                                  value: order.hotel_offer.breakfast_info
                                props:
                                  variant: caption
                          - type: Flex
                            gap: 1
                            children:
                              - type: Text
                                bind:
                                  value: "窗型"
                                props:
                                  variant: caption
                                  color: muted
                              - type: Text
                                bind:
                                  value: order.hotel_offer.window_type
                                props:
                                  variant: caption
                          - type: Flex
                            gap: 1
                            children:
                              - type: Text
                                bind:
                                  value: "楼层"
                                props:
                                  variant: caption
                                  color: muted
                              - type: Text
                                bind:
                                  value: order.hotel_offer.floor_info
                                props:
                                  variant: caption
                      - type: Separator
                      # 入住退房日期
                      - type: Flex
                        props:
                          justify: space-between
                        children:
                          - type: Stack
                            gap: 0
                            children:
                              - type: Text
                                bind:
                                  value: "入住日期"
                                props:
                                  variant: caption
                                  color: muted
                              - type: Text
                                bind:
                                  value: order.hotel_offer.check_in_date
                          - type: Stack
                            gap: 0
                            children:
                              - type: Text
                                bind:
                                  value: "退房日期"
                                props:
                                  variant: caption
                                  color: muted
                              - type: Text
                                bind:
                                  value: order.hotel_offer.check_out_date
                      - type: Separator
                      # 取消扣费说明
                      - type: Flex
                        props:
                          justify: space-between
                        children:
                          - type: Text
                            bind:
                              value: "取消扣费"
                            props:
                              variant: caption
                              color: muted
                          - type: Text
                            bind:
                              value: order.hotel_offer.cancellation_fee
                            props:
                              variant: caption

            # ========== 出行人/乘客/入住人 ==========
            # 机票乘客列表
            - type: Card
              visible_when:
                field: order.product_type
                op: eq
                value: flight
              slots:
                header:
                  - type: Text
                    bind:
                      value: "出行信息"
                    props:
                      variant: h4
                      weight: bold
                content:
                  - type: Stack
                    gap: 2
                    children_from:
                      source: order.ticket_passenger_infos
                      template:
                        type: Flex
                        props:
                          justify: space-between
                          align: center
                        children:
                          - type: Flex
                            gap: 2
                            props:
                              align: center
                            children:
                              - type: Text
                                bind:
                                  value: item.name
                              - type: Badge
                                bind:
                                  label: item.ticket_status
                                  variant: outline
                          - type: Text
                            bind:
                              value: item.id_number
                            props:
                              variant: caption
                              color: muted

            # 火车票乘客列表
            - type: Card
              visible_when:
                field: order.product_type
                op: eq
                value: train
              slots:
                header:
                  - type: Text
                    bind:
                      value: "乘客信息"
                    props:
                      variant: h4
                      weight: bold
                content:
                  - type: Stack
                    gap: 2
                    children_from:
                      source: order.ticket_passenger_infos
                      template:
                        type: Flex
                        props:
                          justify: space-between
                          align: center
                        children:
                          - type: Flex
                            gap: 2
                            props:
                              align: center
                            children:
                              - type: Text
                                bind:
                                  value: item.name
                              - type: Badge
                                bind:
                                  label: item.seat_no
                                  variant: secondary
                              - type: Badge
                                bind:
                                  label: item.seat_class
                                  variant: outline
                          - type: Badge
                            bind:
                              label: item.ticket_status
                              variant: outline

            # 酒店入住人列表
            - type: Card
              visible_when:
                field: order.product_type
                op: eq
                value: hotel
              slots:
                header:
                  - type: Text
                    bind:
                      value: "入住人信息"
                    props:
                      variant: h4
                      weight: bold
                content:
                  - type: Stack
                    gap: 2
                    children_from:
                      source: order.hotel_offer.guests
                      template:
                        type: Flex
                        props:
                          justify: space-between
                          align: center
                        children:
                          - type: Flex
                            gap: 2
                            props:
                              align: center
                            children:
                              - type: Text
                                bind:
                                  value: item.room_no
                                props:
                                  variant: caption
                                  color: muted
                              - type: Text
                                bind:
                                  value: item.name
                          - type: Text
                            bind:
                              value: item.phone
                            props:
                              variant: caption
                              color: muted

            # ========== 酒店报销凭证区域 ==========
            - type: Card
              visible_when:
                field: order.product_type
                op: eq
                value: hotel
              slots:
                header:
                  - type: Text
                    bind:
                      value: "报销凭证"
                    props:
                      variant: h4
                      weight: bold
                content:
                  - type: Stack
                    gap: 2
                    children:
                      - type: Text
                        bind:
                          value: "如需报销凭证，请在退房后申请"
                        props:
                          variant: caption
                          color: muted
                      - type: Button
                        bind:
                          label: "申请报销凭证"
                          variant: outline
                        visible_when:
                          field: order.status
                          op: eq
                          value: completed

        # ========== 操作栏 ==========
        - type: ControlBar
          position: sticky_bottom
          children:
            # 机票操作
            - type: Button
              bind:
                label: "申请退票"
                variant: outline
              visible_when:
                field: order.product_type
                op: eq
                value: flight
            - type: Button
              bind:
                label: "申请改签"
                variant: outline
              visible_when:
                field: order.product_type
                op: eq
                value: flight

            # 火车票操作
            - type: Button
              bind:
                label: "改签"
                variant: outline
              visible_when:
                field: order.product_type
                op: eq
                value: train
            - type: Button
              bind:
                label: "退票"
                variant: outline
              visible_when:
                field: order.product_type
                op: eq
                value: train

            # 酒店操作
            - type: Button
              bind:
                label: "取消订单"
                variant: destructive
              visible_when:
                field: order.status
                op: in
                value:
                  - submitted
                  - booking_pending

            # 通用: 联系客服
            - type: Button
              bind:
                label: "联系客服"
                variant: secondary

  data_sources:
    - name: order
      type: read
      resource: Travel.TravelOrder
      params:
        id: route.order_id
      load:
        - hotel_offer
        - flight_offer
        - vacation_offer
        - train_offer
        - fulfillments
        - customer
        - payment
    - name: fulfillments
      type: list
      resource: Travel.TravelFulfillment
      filters:
        - field: order_id
          op: eq
          value: route.order_id
      sort:
        - field: inserted_at
          direction: asc

  permissions:
    access: authenticated
    data_scope:
      field: tenant_id
      eq: actor.tenant_id
