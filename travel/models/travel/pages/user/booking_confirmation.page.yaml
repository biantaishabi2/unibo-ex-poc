# 预订结果确认页
version: "1.0"
page:
  name: booking_confirmation
  title: 预订结果
  page_type: composition
  audience: user
  entity: TravelOrder
  route: /travel/booking/confirmation/:order_id

  layout:
    - type: Stack
      gap: 0
      children:
        # 顶部导航
        - type: Header
          bind:
            back: true
            title: "预订结果"

        - type: Stack
          gap: 3
          props:
            padding: 3
          children:
            # ========== 状态区域 ==========
            - type: Card
              slots:
                content:
                  - type: Stack
                    gap: 2
                    props:
                      align: center
                      padding: 4
                    children:
                      # 成功图标
                      - type: Icon
                        bind:
                          name: check-circle
                        props:
                          size: lg
                          color: success
                        visible_when:
                          field: order.status
                          op: in
                          value:
                            - booked
                            - booking_pending
                            - submitted
                      # 失败图标
                      - type: Icon
                        bind:
                          name: x-circle
                        props:
                          size: lg
                          color: destructive
                        visible_when:
                          field: order.status
                          op: eq
                          value: failed
                      # 成功文案
                      - type: Text
                        bind:
                          value: "预订成功"
                        props:
                          variant: h2
                          weight: bold
                        visible_when:
                          field: order.status
                          op: in
                          value:
                            - booked
                            - booking_pending
                            - submitted
                      # 失败文案
                      - type: Text
                        bind:
                          value: "预订失败"
                        props:
                          variant: h2
                          weight: bold
                        visible_when:
                          field: order.status
                          op: eq
                          value: failed
                      # 失败原因提示
                      - type: Text
                        bind:
                          value: "请稍后重试或联系客服"
                        props:
                          variant: caption
                          color: muted
                        visible_when:
                          field: order.status
                          op: eq
                          value: failed

            # ========== 订单摘要 Card ==========
            - type: Card
              slots:
                header:
                  - type: Text
                    bind:
                      value: "订单摘要"
                    props:
                      variant: h4
                      weight: bold
                content:
                  - type: Stack
                    gap: 2
                    children:
                      # 订单号
                      - type: Flex
                        props:
                          justify: space-between
                        children:
                          - type: Text
                            bind:
                              value: "订单号"
                            props:
                              variant: caption
                              color: muted
                          - type: Text
                            bind:
                              value: order.order_no
                      - type: Separator
                      # 产品类型
                      - type: Flex
                        props:
                          justify: space-between
                        children:
                          - type: Text
                            bind:
                              value: "产品类型"
                            props:
                              variant: caption
                              color: muted
                          - type: Badge
                            bind:
                              label: order.product_type
                              variant: secondary
                      - type: Separator
                      # 机票行程摘要
                      - type: Flex
                        props:
                          justify: space-between
                        children:
                          - type: Text
                            bind:
                              value: "航班"
                            props:
                              variant: caption
                              color: muted
                          - type: Text
                            bind:
                              value: order.flight_offer.flight_no
                        visible_when:
                          field: order.product_type
                          op: eq
                          value: flight
                      # 酒店行程摘要
                      - type: Flex
                        props:
                          justify: space-between
                        children:
                          - type: Text
                            bind:
                              value: "酒店"
                            props:
                              variant: caption
                              color: muted
                          - type: Text
                            bind:
                              value: order.hotel_offer.hotel_name
                        visible_when:
                          field: order.product_type
                          op: eq
                          value: hotel
                      # 火车行程摘要
                      - type: Flex
                        props:
                          justify: space-between
                        children:
                          - type: Text
                            bind:
                              value: "车次"
                            props:
                              variant: caption
                              color: muted
                          - type: Text
                            bind:
                              value: order.train_offer.train_no
                        visible_when:
                          field: order.product_type
                          op: eq
                          value: train
                      - type: Separator
                      # 出行人数
                      - type: Flex
                        props:
                          justify: space-between
                        children:
                          - type: Text
                            bind:
                              value: "出行人数"
                            props:
                              variant: caption
                              color: muted
                          - type: Text
                            bind:
                              value: order.traveler_count
                      - type: Separator
                      # 金额
                      - type: Flex
                        props:
                          justify: space-between
                        children:
                          - type: Text
                            bind:
                              value: "订单金额"
                            props:
                              variant: caption
                              color: muted
                          - type: Text
                            bind:
                              value: order.total_amount
                            props:
                              variant: h3
                              color: primary

            # ========== 操作按钮 ==========
            - type: Stack
              gap: 2
              children:
                - type: Button
                  bind:
                    label: "查看订单"
                    variant: primary
                  props:
                    size: lg
                    full_width: true
                  action: navigate
                  params:
                    to: /travel/orders/{{ order.id }}
                - type: Button
                  bind:
                    label: "回到首页"
                    variant: outline
                  props:
                    size: lg
                    full_width: true
                  action: navigate
                  params:
                    to: /travel

  data_sources:
    - name: order
      type: read
      resource: Travel.TravelOrder
      params:
        id: route.order_id
      load:
        - hotel_offer
        - flight_offer
        - train_offer

  permissions:
    access: authenticated
    data_scope:
      field: tenant_id
      eq: actor.tenant_id
