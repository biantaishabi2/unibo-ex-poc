# 酒店详情+房型列表页
# 场景：查看酒店信息、浏览房型和报价方案
# 特征：酒店大图+信息+日期筛选+房型列表（多报价方案）
version: "1.0"
page:
  name: hotel_detail
  title: 酒店详情
  page_type: composition
  audience: user
  entity: TravelHotel
  route: /travel/hotel/:hotel_code

  layout:
    - type: Stack
      gap: 0
      children:
        # 顶部导航
        - type: Header
          bind:
            back: true
            title: hotel.hotel_name

        # 酒店大图
        - type: Image
          bind:
            src: hotel.cover_image
            alt: hotel.hotel_name
          props:
            aspect_ratio: "16:9"
            width: full

        # 酒店基本信息
        - type: Stack
          gap: 2
          props:
            padding: 4
          children:
            - type: Flex
              gap: 2
              props:
                align: center
              children:
                - type: Text
                  bind:
                    value: hotel.hotel_name
                  props:
                    variant: h2
                    weight: bold
                - type: Badge
                  bind:
                    label: hotel.hotel_star
                    variant: secondary

            # 图片 Tab（外观/餐饮/客房）
            - type: Tabs
              bind:
                default_value: exterior
              children:
                - type: Image
                  props:
                    tab_key: exterior
                    tab_label: 外观
                  bind:
                    src: hotel.exterior_image
                    alt: "外观"
                - type: Image
                  props:
                    tab_key: dining
                    tab_label: 餐饮
                  bind:
                    src: hotel.dining_image
                    alt: "餐饮"
                - type: Image
                  props:
                    tab_key: room
                    tab_label: 客房
                  bind:
                    src: hotel.room_image
                    alt: "客房"

            # 评分与地址
            - type: Flex
              gap: 2
              props:
                align: center
              children:
                - type: Badge
                  bind:
                    label: hotel.score
                    variant: primary
                - type: Text
                  bind:
                    value: hotel.score_label
                  props:
                    variant: body
                    color: primary
            - type: Flex
              gap: 1
              props:
                align: center
              children:
                - type: Icon
                  bind:
                    name: map-pin
                  props:
                    size: sm
                    color: muted
                - type: Text
                  bind:
                    value: hotel.address
                  props:
                    variant: caption
                    color: muted

        - type: Separator

        # 日期筛选
        - type: Flex
          gap: 2
          props:
            padding: 3
            align: center
          children:
            - type: Input
              bind:
                label: "入住"
                value: filter.checkin_date
                input_type: date
            - type: Input
              bind:
                label: "退房"
                value: filter.checkout_date
                input_type: date
            - type: Button
              bind:
                label: "查询"
                variant: outline
              action: refresh_offers

        - type: Separator

        # 房型列表标题
        - type: Text
          bind:
            value: "房型报价"
          props:
            variant: h3
            padding: 3

        # 房型卡片列表
        - type: Stack
          gap: 3
          props:
            padding: 3
          children_from:
            source: offers.items
            template:
              type: Card
              slots:
                header:
                  - type: Flex
                    gap: 3
                    children:
                      - type: Image
                        bind:
                          src: item.room_type_ref.room_image
                          alt: item.room_type_ref.room_type_name
                        props:
                          width: 120
                          height: 90
                          border_radius: sm
                      - type: Stack
                        gap: 1
                        children:
                          - type: Text
                            bind:
                              value: item.room_type_ref.room_type_name
                            props:
                              variant: h4
                              weight: bold
                          - type: Text
                            bind:
                              value: item.room_type_ref.bed_type
                            props:
                              variant: caption
                              color: muted
                          - type: Flex
                            gap: 1
                            props:
                              wrap: true
                            children:
                              - type: Badge
                                bind:
                                  label: item.room_type_ref.area_label
                                  variant: outline
                              - type: Badge
                                bind:
                                  label: item.room_type_ref.floor_label
                                  variant: outline
                              - type: Badge
                                bind:
                                  label: item.room_type_ref.wifi_label
                                  variant: outline
                content:
                  - type: Stack
                    gap: 2
                    children:
                      # 报价方案行
                      - type: Flex
                        props:
                          justify: space-between
                          align: center
                          padding_y: 2
                        children:
                          - type: Stack
                            gap: 1
                            children:
                              - type: Text
                                bind:
                                  value: item.rate_plan_code
                                props:
                                  variant: body
                                  weight: medium
                              - type: Flex
                                gap: 1
                                children:
                                  - type: Badge
                                    bind:
                                      label: item.cancellation_policy
                                      variant: outline
                                  - type: Badge
                                    visible_when:
                                      field: item.is_breakfast_included
                                      op: eq
                                      value: true
                                    bind:
                                      label: "含早"
                                      variant: success
                                  - type: Badge
                                    visible_when:
                                      field: item.is_policy_compliant
                                      op: eq
                                      value: false
                                    bind:
                                      label: "超标"
                                      variant: destructive
                          - type: Flex
                            gap: 2
                            props:
                              align: center
                            children:
                              - type: Flex
                                gap: 1
                                props:
                                  align: baseline
                                children:
                                  - type: Text
                                    bind:
                                      value: item.currency
                                    props:
                                      variant: caption
                                  - type: Text
                                    bind:
                                      value: item.listed_price
                                    props:
                                      variant: h3
                                      color: primary
                              - type: Button
                                bind:
                                  label: "预订"
                                  variant: primary
                                props:
                                  size: sm
                                action: navigate
                                params:
                                  to: /travel/hotel/booking/{item.id}

        # 空状态
        - type: EmptyState
          visible_when:
            field: offers.total_count
            op: eq
            value: 0
          bind:
            title: "暂无可用房型"
            description: "请调整日期后重试"
            icon: bed

  data_sources:
    - name: hotel
      type: read
      entity: TravelHotel
      params:
        hotel_code: route.hotel_code
    - name: offers
      type: list
      entity: HotelOffer
      params:
        hotel_code: route.hotel_code
        checkin_date: route.checkin_date
        checkout_date: route.checkout_date

  permissions:
    access: authenticated
    data_scope:
      field: tenant_id
      eq: actor.tenant_id
