# 机票航班详情页
# 场景：查看航班详细信息和舱位列表
# 特征：航线摘要+航班信息+舱位列表（价格/行李/退改/库存）
version: "1.0"
page:
  name: flight_detail
  title: 航班详情
  page_type: composition
  audience: user
  entity: FlightOffer
  route: /travel/flight/:offer_id

  layout:
    - type: Stack
      gap: 0
      children:
        # 顶部导航
        - type: Header
          bind:
            back: true
            title: offer.flight_no

        # 航线摘要头
        - type: Stack
          gap: 3
          props:
            padding: 4
            background: primary
          children:
            - type: Flex
              props:
                justify: space-between
                align: center
              children:
                # 出发
                - type: Stack
                  gap: 0
                  props:
                    align: center
                  children:
                    - type: Text
                      bind:
                        value: offer.departure_time
                      props:
                        variant: h1
                        weight: bold
                        color: white
                    - type: Text
                      bind:
                        value: offer.departure_airport_ref.city_name
                      props:
                        variant: body
                        color: white
                    - type: Text
                      bind:
                        value: offer.departure_airport_code
                      props:
                        variant: caption
                        color: white
                # 中间飞行信息
                - type: Stack
                  gap: 0
                  props:
                    align: center
                  children:
                    - type: Text
                      bind:
                        value: offer.duration_label
                      props:
                        variant: caption
                        color: white
                    - type: Icon
                      bind:
                        name: plane
                      props:
                        color: white
                    - type: Text
                      bind:
                        value: offer.date_label
                      props:
                        variant: caption
                        color: white
                # 到达
                - type: Stack
                  gap: 0
                  props:
                    align: center
                  children:
                    - type: Text
                      bind:
                        value: offer.arrival_time
                      props:
                        variant: h1
                        weight: bold
                        color: white
                    - type: Text
                      bind:
                        value: offer.arrival_airport_ref.city_name
                      props:
                        variant: body
                        color: white
                    - type: Text
                      bind:
                        value: offer.arrival_airport_code
                      props:
                        variant: caption
                        color: white

        # 航班详细信息
        - type: Card
          slots:
            header:
              - type: Text
                bind:
                  value: "航班信息"
                props:
                  variant: h4
                  weight: bold
            content:
              - type: Grid
                columns: 2
                gap: 3
                children:
                  - type: Statistic
                    bind:
                      title: "航空公司"
                      value: offer.airline_ref.name
                  - type: Statistic
                    bind:
                      title: "航班号"
                      value: offer.flight_no
                  - type: Statistic
                    bind:
                      title: "机型"
                      value: offer.aircraft_type
                  - type: Statistic
                    bind:
                      title: "餐食"
                      value: offer.meal_label
                  - type: Statistic
                    bind:
                      title: "出发航站楼"
                      value: offer.departure_terminal
                  - type: Statistic
                    bind:
                      title: "到达航站楼"
                      value: offer.arrival_terminal
                  - type: Statistic
                    bind:
                      title: "准点率"
                      value: offer.on_time_rate

        - type: Separator

        # 舱位列表标题
        - type: Text
          bind:
            value: "选择舱位"
          props:
            variant: h3
            padding: 3

        # 舱位列表
        - type: Stack
          gap: 2
          props:
            padding: 3
          children_from:
            source: offer.cabin_options
            template:
              type: Card
              slots:
                content:
                  - type: Flex
                    props:
                      justify: space-between
                      align: center
                    children:
                      - type: Stack
                        gap: 1
                        children:
                          - type: Flex
                            gap: 2
                            props:
                              align: center
                            children:
                              - type: Text
                                bind:
                                  value: item.cabin_name
                                props:
                                  variant: body
                                  weight: bold
                              - type: Badge
                                visible_when:
                                  field: item.discount_label
                                  op: not_null
                                bind:
                                  label: item.discount_label
                                  variant: success
                          - type: Flex
                            gap: 1
                            props:
                              wrap: true
                            children:
                              - type: Badge
                                bind:
                                  label: item.baggage_policy
                                  variant: outline
                              - type: Badge
                                bind:
                                  label: item.mileage_label
                                  variant: outline
                          - type: Flex
                            gap: 1
                            props:
                              wrap: true
                            children:
                              - type: Badge
                                bind:
                                  label: item.refund_policy
                                  variant: outline
                              - type: Badge
                                bind:
                                  label: item.change_policy
                                  variant: outline
                          - type: Text
                            bind:
                              value: item.seats_label
                            props:
                              variant: caption
                              color: muted
                      - type: Stack
                        gap: 1
                        props:
                          align: flex-end
                        children:
                          - type: Flex
                            gap: 1
                            props:
                              align: baseline
                            children:
                              - type: Text
                                bind:
                                  value: item.currency
                                props:
                                  variant: caption
                              - type: Text
                                bind:
                                  value: item.price
                                props:
                                  variant: h3
                                  color: primary
                          - type: Button
                            bind:
                              label: "预订"
                              variant: primary
                            props:
                              size: sm
                            action: navigate
                            params:
                              to: /travel/flight/booking/{item.offer_id}

  data_sources:
    - name: offer
      type: read
      entity: FlightOffer
      params:
        id: route.offer_id

  permissions:
    access: authenticated
    data_scope:
      field: tenant_id
      eq: actor.tenant_id
