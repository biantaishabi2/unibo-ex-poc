# 差旅首页 — 三 Tab 切换（机票/酒店/火车票）
# 场景：用户进入差旅模块的入口页面
# 特征：搜索表单切换、底部导航
version: "1.0"
page:
  name: home
  title: 差旅
  page_type: composition
  audience: user
  entity: FlightOffer
  route: /travel

  layout:
    - type: Stack
      gap: 0
      children:
        # 顶部标题
        - type: Header
          bind:
            title: "差旅出行"

        # 搜索 Tab 区域
        - type: Tabs
          bind:
            default_value: flight
          children:
            # 机票 Tab
            - type: Stack
              gap: 4
              props:
                tab_key: flight
                tab_label: 机票
                padding: 4
              children:
                - type: Flex
                  gap: 3
                  props:
                    direction: column
                  children:
                    - type: Input
                      bind:
                        label: "出发城市"
                        placeholder: "请选择出发城市"
                        value: form.departure_city
                    - type: Input
                      bind:
                        label: "目的城市"
                        placeholder: "请选择目的城市"
                        value: form.arrival_city
                    - type: Input
                      bind:
                        label: "出发日期"
                        placeholder: "请选择日期"
                        value: form.departure_date
                        input_type: date
                    - type: Flex
                      gap: 2
                      props:
                        align: center
                      children:
                        - type: Checkbox
                          bind:
                            label: "仅看直飞"
                            value: form.direct_only
                    - type: Button
                      bind:
                        label: "因公出行·搜索机票"
                        variant: primary
                      props:
                        size: lg
                        full_width: true
                      action: navigate
                      params:
                        to: /travel/flight/search

            # 酒店 Tab
            - type: Stack
              gap: 4
              props:
                tab_key: hotel
                tab_label: 酒店
                padding: 4
              children:
                - type: Flex
                  gap: 3
                  props:
                    direction: column
                  children:
                    - type: Input
                      bind:
                        label: "城市"
                        placeholder: "请选择城市"
                        value: form.hotel_city
                    - type: Flex
                      gap: 2
                      children:
                        - type: Input
                          bind:
                            label: "入住日期"
                            placeholder: "请选择"
                            value: form.checkin_date
                            input_type: date
                        - type: Input
                          bind:
                            label: "退房日期"
                            placeholder: "请选择"
                            value: form.checkout_date
                            input_type: date
                    - type: Input
                      bind:
                        label: "关键词"
                        placeholder: "酒店名/商圈/地标"
                        value: form.hotel_keyword
                    - type: Button
                      bind:
                        label: "因公出行·搜索酒店"
                        variant: primary
                      props:
                        size: lg
                        full_width: true
                      action: navigate
                      params:
                        to: /travel/hotel/search

            # 火车票 Tab
            - type: Stack
              gap: 4
              props:
                tab_key: train
                tab_label: 火车票
                padding: 4
              children:
                - type: Flex
                  gap: 3
                  props:
                    direction: column
                  children:
                    - type: Input
                      bind:
                        label: "出发站"
                        placeholder: "请选择出发站"
                        value: form.departure_station
                    - type: Input
                      bind:
                        label: "到达站"
                        placeholder: "请选择到达站"
                        value: form.arrival_station
                    - type: Input
                      bind:
                        label: "出发日期"
                        placeholder: "请选择日期"
                        value: form.train_date
                        input_type: date
                    - type: Flex
                      gap: 2
                      props:
                        align: center
                      children:
                        - type: Checkbox
                          bind:
                            label: "只看高铁动车"
                            value: form.high_speed_only
                    - type: Button
                      bind:
                        label: "因公出行·搜索火车票"
                        variant: primary
                      props:
                        size: lg
                        full_width: true
                      action: navigate
                      params:
                        to: /travel/train/search

        # 底部导航栏
        - type: BottomTabs
          children:
            - type: Button
              bind:
                label: "首页"
                icon: home
              action: navigate
              params:
                to: /travel
            - type: Button
              bind:
                label: "行程"
                icon: calendar
              action: navigate
              params:
                to: /travel/trips
            - type: Button
              bind:
                label: "订单"
                icon: list
              action: navigate
              params:
                to: /travel/orders
            - type: Button
              bind:
                label: "我的"
                icon: user
              action: navigate
              params:
                to: /travel/profile

  data_sources: []

  permissions:
    access: authenticated
