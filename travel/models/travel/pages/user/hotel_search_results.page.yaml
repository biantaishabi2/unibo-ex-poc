# 酒店搜索结果页
# 场景：按条件搜索酒店列表，支持筛选排序
# 特征：搜索头+筛选栏+酒店卡片列表+差标提示
version: "1.0"
page:
  name: hotel_search_results
  title: 酒店搜索
  page_type: composition
  audience: user
  entity: HotelOffer
  route: /travel/hotel/search

  layout:
    - type: Stack
      gap: 0
      children:
        # 顶部导航
        - type: Header
          bind:
            back: true
            title: "酒店搜索"

        # 搜索条件摘要
        - type: Flex
          gap: 2
          props:
            padding: 3
            align: center
            background: surface
          children:
            - type: Badge
              bind:
                label: search.checkin_date
                variant: outline
            - type: Text
              bind:
                value: "-"
            - type: Badge
              bind:
                label: search.checkout_date
                variant: outline
            - type: Input
              bind:
                placeholder: "酒店名/商圈/地标"
                value: search.keyword
              props:
                size: sm

        # 筛选栏
        - type: Flex
          gap: 2
          props:
            padding_x: 3
            padding_y: 2
            wrap: true
          children:
            - type: Select
              bind:
                label: "排序"
                value: filter.sort_by
                options:
                  - { label: "推荐", value: recommended }
                  - { label: "价格低到高", value: price_asc }
                  - { label: "价格高到低", value: price_desc }
                  - { label: "星级", value: star_desc }
            - type: Select
              bind:
                label: "区域"
                value: filter.area
            - type: Select
              bind:
                label: "价格星级"
                value: filter.price_star
                options:
                  - { label: "不限", value: all }
                  - { label: "200以下", value: under_200 }
                  - { label: "200-500", value: 200_500 }
                  - { label: "500-1000", value: 500_1000 }
                  - { label: "1000以上", value: above_1000 }
            - type: Select
              bind:
                label: "差标"
                value: filter.policy_compliant
                options:
                  - { label: "不限", value: all }
                  - { label: "符合差标", value: compliant }
            - type: Select
              bind:
                label: "协议酒店"
                value: filter.agreement_hotel
                options:
                  - { label: "不限", value: all }
                  - { label: "协议酒店", value: agreement }

        # 超标提示
        - type: Alert
          visible_when:
            field: policy.exceeded
            op: eq
            value: true
          bind:
            variant: warning
            title: "超标提示"
            description: "以下标记超标的酒店超出差旅标准，预订需审批"

        # 酒店卡片列表
        - type: Stack
          gap: 3
          props:
            padding: 3
          children_from:
            source: hotels.items
            template:
              type: Card
              slots:
                header:
                  - type: Image
                    bind:
                      src: item.hotel_ref.cover_image
                      alt: item.hotel_name
                    props:
                      aspect_ratio: "16:9"
                      border_radius: top
                content:
                  - type: Stack
                    gap: 2
                    children:
                      - type: Flex
                        gap: 2
                        props:
                          align: center
                        children:
                          - type: Text
                            bind:
                              value: item.hotel_name
                            props:
                              variant: h4
                              weight: bold
                          - type: Badge
                            bind:
                              label: item.hotel_ref.hotel_star
                              variant: secondary
                      - type: Flex
                        gap: 2
                        props:
                          align: center
                        children:
                          - type: Badge
                            bind:
                              label: item.hotel_ref.score
                              variant: primary
                          - type: Text
                            bind:
                              value: item.hotel_ref.address
                            props:
                              variant: caption
                              color: muted
                      - type: Flex
                        gap: 1
                        props:
                          wrap: true
                        children_from:
                          source: item.hotel_ref.facilities
                          template:
                            type: Badge
                            bind:
                              label: item.name
                              variant: outline
                footer:
                  - type: Flex
                    props:
                      justify: space-between
                      align: center
                    children:
                      - type: Badge
                        visible_when:
                          field: item.is_agreement
                          op: eq
                          value: true
                        bind:
                          label: "协议酒店"
                          variant: success
                      - type: Flex
                        gap: 1
                        props:
                          align: baseline
                        children:
                          - type: Text
                            bind:
                              value: item.currency
                            props:
                              variant: caption
                          - type: Text
                            bind:
                              value: item.listed_price
                            props:
                              variant: h3
                              color: primary
                          - type: Text
                            bind:
                              value: "起"
                            props:
                              variant: caption
              action: navigate
              params:
                to: /travel/hotel/{item.hotel_code}

        # 空状态
        - type: EmptyState
          visible_when:
            field: hotels.total_count
            op: eq
            value: 0
          bind:
            title: "未找到酒店"
            description: "请调整搜索条件后重试"
            icon: search

  data_sources:
    - name: hotels
      type: list
      entity: HotelOffer
      params:
        checkin_date: route.checkin_date
        checkout_date: route.checkout_date
        city_code: route.city_code
        keyword: route.keyword
    - name: policy
      type: read
      entity: TravelPolicy
      params:
        tenant_id: actor.tenant_id

  permissions:
    access: authenticated
    data_scope:
      field: tenant_id
      eq: actor.tenant_id
