# 火车票预订页
# 场景：填写乘车人、联系人、选座偏好并提交预订
# 特征：车次摘要+差标提示+乘车人+联系人+选座偏好+支付方式+底部提交栏
version: "1.0"
page:
  name: train_booking
  title: 火车票预订
  page_type: composition
  audience: user
  entity: TrainOffer
  route: /travel/train/booking/:offer_id

  layout:
    - type: Stack
      gap: 0
      children:
        # 顶部导航
        - type: Header
          bind:
            back: true
            title: "填写订单"

        - type: Stack
          gap: 3
          props:
            padding: 3
          children:
            # 车次摘要卡片
            - type: Card
              slots:
                header:
                  - type: Flex
                    gap: 2
                    props:
                      align: center
                    children:
                      - type: Text
                        bind:
                          value: offer.train_no
                        props:
                          variant: body
                          weight: bold
                      - type: Badge
                        bind:
                          label: offer.train_type_label
                          variant: outline
                      - type: Badge
                        bind:
                          label: offer.selected_seat_class_name
                          variant: secondary
                content:
                  - type: Flex
                    props:
                      justify: space-between
                      align: center
                    children:
                      - type: Stack
                        gap: 0
                        props:
                          align: center
                        children:
                          - type: Text
                            bind:
                              value: offer.departure_time
                            props:
                              variant: h2
                              weight: bold
                          - type: Text
                            bind:
                              value: offer.departure_station_name
                            props:
                              variant: caption
                              color: muted
                      - type: Stack
                        gap: 0
                        props:
                          align: center
                        children:
                          - type: Text
                            bind:
                              value: offer.date_label
                            props:
                              variant: caption
                              color: muted
                          - type: Icon
                            bind:
                              name: arrow-right
                            props:
                              size: sm
                      - type: Stack
                        gap: 0
                        props:
                          align: center
                        children:
                          - type: Text
                            bind:
                              value: offer.arrival_time
                            props:
                              variant: h2
                              weight: bold
                          - type: Text
                            bind:
                              value: offer.arrival_station_name
                            props:
                              variant: caption
                              color: muted
                footer:
                  - type: Flex
                    props:
                      justify: flex-end
                      align: baseline
                    children:
                      - type: Text
                        bind:
                          value: offer.currency
                        props:
                          variant: caption
                      - type: Text
                        bind:
                          value: offer.selected_seat_price
                        props:
                          variant: h2
                          color: primary

            # 差标提示
            - type: Alert
              visible_when:
                field: offer.is_policy_exceeded
                op: eq
                value: true
              bind:
                variant: warning
                title: "超出差旅标准"
                description: "该席别超出您的差旅标准，提交后需经审批"

            # 乘车人
            - type: Card
              slots:
                header:
                  - type: Flex
                    props:
                      justify: space-between
                      align: center
                    children:
                      - type: Text
                        bind:
                          value: "乘车人"
                        props:
                          variant: h4
                          weight: bold
                      - type: Button
                        bind:
                          label: "+ 添加"
                          variant: ghost
                        props:
                          size: sm
                        action: add_traveler
                content:
                  - type: Stack
                    gap: 2
                    children_from:
                      source: travelers.items
                      template:
                        type: Flex
                        gap: 2
                        props:
                          align: center
                          padding_y: 2
                        children:
                          - type: Checkbox
                            bind:
                              value: item.selected
                          - type: Avatar
                            bind:
                              src: item.avatar
                              fallback: item.name_initial
                            props:
                              size: sm
                          - type: Stack
                            gap: 0
                            children:
                              - type: Text
                                bind:
                                  value: item.name
                                props:
                                  variant: body
                              - type: Text
                                bind:
                                  value: item.id_type_label
                                props:
                                  variant: caption
                                  color: muted

            # 联系人
            - type: Card
              slots:
                header:
                  - type: Text
                    bind:
                      value: "联系人"
                    props:
                      variant: h4
                      weight: bold
                content:
                  - type: Stack
                    gap: 3
                    children:
                      - type: Input
                        bind:
                          label: "联系人姓名"
                          placeholder: "请输入联系人姓名"
                          value: form.contact_name
                      - type: Input
                        bind:
                          label: "手机号"
                          placeholder: "请输入手机号"
                          value: form.contact_phone

            # 选座偏好
            - type: Card
              slots:
                header:
                  - type: Text
                    bind:
                      value: "选座偏好"
                    props:
                      variant: h4
                      weight: bold
                content:
                  - type: Select
                    bind:
                      label: "座位偏好"
                      value: form.seat_preference
                      options:
                        - { label: "无偏好", value: no_preference }
                        - { label: "靠窗", value: window }
                        - { label: "靠过道", value: aisle }

            # 支付方式
            - type: Card
              slots:
                header:
                  - type: Text
                    bind:
                      value: "支付方式"
                    props:
                      variant: h4
                      weight: bold
                content:
                  - type: Select
                    bind:
                      label: "选择支付方式"
                      value: form.payment_method
                      options:
                        - { label: "企业支付", value: corporate }
                        - { label: "个人支付", value: personal }

        # 底部提交栏
        - type: ControlBar
          position: sticky_bottom
          children:
            - type: Flex
              props:
                justify: space-between
                align: center
                width: full
              children:
                - type: Flex
                  gap: 1
                  props:
                    align: baseline
                  children:
                    - type: Text
                      bind:
                        value: "合计"
                      props:
                        variant: caption
                    - type: Text
                      bind:
                        value: offer.currency
                      props:
                        variant: caption
                        color: primary
                    - type: Text
                      bind:
                        value: offer.total_price
                      props:
                        variant: h2
                        color: primary
                - type: Button
                  bind:
                    label: "提交订单"
                    variant: primary
                  props:
                    size: lg
                  action: submit_booking

  data_sources:
    - name: offer
      type: read
      entity: TrainOffer
      params:
        id: route.offer_id
    - name: travelers
      type: list
      entity: TravelerProfile
      params:
        tenant_id: actor.tenant_id

  permissions:
    access: authenticated
    data_scope:
      field: tenant_id
      eq: actor.tenant_id
