# 差旅订单列表页（管理后台）
version: "1.0"
page:
  name: order_list
  title: 差旅订单管理
  route: /admin/travel/orders
  page_type: list_report
  entity: TravelOrder
  audience: admin

  permissions:
    access: role
    roles: [admin]

  data_sources:
    - name: orders
      type: list
      resource: Travel.TravelOrder
      sort:
        - field: inserted_at
          direction: desc

  slots:
    filter_bar:
      - field: status
        type: select
        label: 订单状态
        options:
          - { label: 全部, value: "" }
          - { label: 草稿, value: draft }
          - { label: 已报价, value: quoted }
          - { label: 已提交, value: submitted }
          - { label: 预订中, value: booking_pending }
          - { label: 已预订, value: booked }
          - { label: 取消中, value: cancel_pending }
          - { label: 已取消, value: cancelled }
          - { label: 已完成, value: completed }
          - { label: 失败, value: failed }
      - field: product_type
        type: select
        label: 产品类型
        options:
          - { label: 全部, value: "" }
          - { label: 酒店, value: hotel }
          - { label: 机票, value: flight }
          - { label: 度假, value: vacation }
          - { label: 火车票, value: train }
      - field: order_no
        type: search
        label: 订单号
        placeholder: 搜索订单号
      - field: inserted_at
        type: date_range
        label: 创建时间

    table:
      columns:
        - field: order_no
          label: 订单号
        - field: product_type
          label: 产品类型
          render: badge
        - field: contact_name
          label: 联系人
        - field: traveler_count
          label: 出行人数
        - field: total_amount
          label: 总金额
          format: currency
        - field: payable_amount
          label: 应付金额
          format: currency
        - field: status
          label: 订单状态
          render: badge
        - field: waitlist_status
          label: 候补状态
          render: badge
        - field: change_status
          label: 改签状态
          render: badge
        - field: inserted_at
          label: 创建时间
          format: datetime

      row_actions:
        - label: 详情
          action: navigate
          params:
            to: /admin/travel/orders/{{ row.id }}
