# 履约记录列表页（管理后台）
version: "1.0"
page:
  name: fulfillment_list
  title: 履约记录管理
  route: /admin/travel/fulfillments
  page_type: list_report
  entity: TravelFulfillment
  audience: admin

  permissions:
    access: role
    roles: [admin]

  data_sources:
    - name: fulfillments
      type: list
      resource: Travel.TravelFulfillment
      sort:
        - field: inserted_at
          direction: desc

  slots:
    filter_bar:
      - field: status
        type: select
        label: 状态
        options:
          - { label: 全部, value: "" }
          - { label: 待处理, value: pending }
          - { label: 已确认, value: confirmed }
          - { label: 已出票, value: issued }
          - { label: 使用中, value: in_use }
          - { label: 已完成, value: completed }
          - { label: 已取消, value: cancelled }
          - { label: 失败, value: failed }
      - field: fulfillment_type
        type: select
        label: 履约类型
        options:
          - { label: 全部, value: "" }
          - { label: 预订房间, value: reserve_room }
          - { label: 出机票, value: issue_ticket }
          - { label: 出凭证, value: issue_voucher }
          - { label: 出火车票, value: issue_train_ticket }

    table:
      columns:
        - field: order.order_no
          label: 订单号
        - field: fulfillment_type
          label: 履约类型
          render: badge
        - field: status
          label: 状态
          render: badge
        - field: supplier_booking_ref
          label: 供应商预订号
        - field: voucher_or_ticket_ref
          label: 票证号
        - field: waitlist_result
          label: 候补结果
          render: badge
        - field: inserted_at
          label: 创建时间
          format: datetime

      row_actions:
        - label: 详情
          action: navigate
          params:
            to: /admin/travel/fulfillments/{{ row.id }}
