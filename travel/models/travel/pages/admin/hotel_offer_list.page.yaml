# 酒店 Offer 列表页（管理后台）
version: "1.0"
page:
  name: hotel_offer_list
  title: 酒店 Offer 管理
  route: /admin/travel/hotel-offers
  page_type: list_report
  entity: HotelOffer
  audience: admin

  permissions:
    access: role
    roles: [admin]

  data_sources:
    - name: hotel_offers
      type: list
      resource: Travel.HotelOffer
      sort:
        - field: inserted_at
          direction: desc

  slots:
    filter_bar:
      - field: sale_status
        type: select
        label: 销售状态
        options:
          - { label: 全部, value: "" }
          - { label: 草稿, value: draft }
          - { label: 上架, value: active }
          - { label: 下架, value: inactive }
          - { label: 过期, value: expired }
      - field: hotel_name
        type: search
        label: 酒店名称
        placeholder: 搜索酒店名称
      - field: checkin_date
        type: date_range
        label: 入住日期

    table:
      columns:
        - field: hotel_name
          label: 酒店名称
        - field: room_type_code
          label: 房型编码
        - field: rate_plan_code
          label: 价格方案
        - field: checkin_date
          label: 入住日期
          format: date
        - field: checkout_date
          label: 退房日期
          format: date
        - field: listed_price
          label: 挂牌价
          format: currency
        - field: settlement_price
          label: 结算价
          format: currency
        - field: inventory_count
          label: 库存
        - field: sale_status
          label: 销售状态
          render: badge

      row_actions:
        - label: 上架
          action: activate
          visible_when:
            field: sale_status
            op: eq
            value: draft
        - label: 下架
          action: deactivate
          visible_when:
            field: sale_status
            op: eq
            value: active
        - label: 详情
          action: navigate
          params:
            to: /admin/travel/hotel-offers/{{ row.id }}

    toolbar:
      actions:
        - label: 新建 Offer
          action: navigate
          params:
            to: /admin/travel/hotel-offers/new
          variant: primary
