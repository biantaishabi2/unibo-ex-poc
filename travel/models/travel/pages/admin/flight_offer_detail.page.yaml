# 机票 Offer 详情页（管理后台）
version: "1.0"
page:
  name: flight_offer_detail
  title: 机票 Offer 详情
  route: /admin/travel/flight-offers/:id
  page_type: object_page
  entity: FlightOffer
  audience: admin

  permissions:
    access: role
    roles: [admin]

  data_sources:
    - name: flight_offer
      type: read
      resource: Travel.FlightOffer
      params:
        id: route.id

  slots:
    header:
      title_field: flight_no
      status_field: sale_status
      status_render: badge

    sections:
      - title: 航班信息
        fields:
          - field: supplier_code
            label: 供应商编码
          - field: itinerary_code
            label: 行程编码
          - field: flight_no
            label: 航班号
          - field: fare_family
            label: 票价系列

      - title: 航线
        fields:
          - field: departure_airport_code
            label: 出发机场
          - field: arrival_airport_code
            label: 到达机场
          - field: departure_at
            label: 出发时间
            format: datetime
          - field: arrival_at
            label: 到达时间
            format: datetime

      - title: 价格
        fields:
          - field: listed_price
            label: 挂牌价
            format: currency
          - field: settlement_price
            label: 结算价
            format: currency
          - field: currency
            label: 币种
          - field: seats_available
            label: 余座数

      - title: 政策
        fields:
          - field: baggage_policy
            label: 行李政策
          - field: refund_change_policy
            label: 退改政策

    actions:
      - label: 上架
        action: activate
        variant: primary
        visible_when:
          field: sale_status
          op: eq
          value: draft
      - label: 下架
        action: deactivate
        variant: warning
        visible_when:
          field: sale_status
          op: eq
          value: active
      - label: 过期
        action: expire
        variant: danger
        visible_when:
          field: sale_status
          op: in
          value:
            - active
            - inactive

    related:
      - name: orders
        title: 关联订单
        entity: TravelOrder
        relationship: orders
        display: table
        columns:
          - field: order_no
            label: 订单号
          - field: contact_name
            label: 联系人
          - field: total_amount
            label: 总金额
            format: currency
          - field: status
            label: 状态
            render: badge
