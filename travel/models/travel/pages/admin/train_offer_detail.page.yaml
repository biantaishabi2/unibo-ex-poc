# 火车票 Offer 详情页（管理后台）
version: "1.0"
page:
  name: train_offer_detail
  title: 火车票 Offer 详情
  route: /admin/travel/train-offers/:id
  page_type: object_page
  entity: TrainOffer
  audience: admin

  permissions:
    access: role
    roles: [admin]

  data_sources:
    - name: train_offer
      type: read
      resource: Travel.TrainOffer
      params:
        id: route.id

  slots:
    header:
      title_field: train_no
      status_field: sale_status
      status_render: badge

    sections:
      - title: 车次信息
        fields:
          - field: train_no
            label: 车次
          - field: departure_station_code
            label: 出发站编码
          - field: departure_station_name
            label: 出发站
          - field: arrival_station_code
            label: 到达站编码
          - field: arrival_station_name
            label: 到达站
          - field: travel_date
            label: 出行日期
            format: date

      - title: 席别
        fields:
          - field: seat_class
            label: 席别
          - field: seat_code
            label: 座席编码
          - field: is_no_seat
            label: 是否无座
          - field: inventory_status
            label: 库存状态
            render: badge
          - field: waitlist_supported
            label: 是否支持候补

      - title: 价格
        fields:
          - field: listed_price
            label: 挂牌价
            format: currency
          - field: settlement_price
            label: 结算价
            format: currency
          - field: currency
            label: 币种

      - title: 规则
        fields:
          - field: booking_rules_snapshot
            label: 预订规则
            format: json
          - field: change_rules_snapshot
            label: 改签规则
            format: json
          - field: refund_rules_snapshot
            label: 退票规则
            format: json

    actions:
      - label: 上架
        action: activate
        variant: primary
        visible_when:
          field: sale_status
          op: eq
          value: draft
      - label: 下架
        action: deactivate
        variant: warning
        visible_when:
          field: sale_status
          op: eq
          value: active
      - label: 过期
        action: expire
        variant: danger
        visible_when:
          field: sale_status
          op: in
          value:
            - active
            - inactive
