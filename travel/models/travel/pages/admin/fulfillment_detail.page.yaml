# 履约记录详情页（管理后台）
version: "1.0"
page:
  name: fulfillment_detail
  title: 履约记录详情
  route: /admin/travel/fulfillments/:id
  page_type: object_page
  entity: TravelFulfillment
  audience: admin

  permissions:
    access: role
    roles: [admin]

  data_sources:
    - name: fulfillment
      type: read
      resource: Travel.TravelFulfillment
      params:
        id: route.id

  slots:
    header:
      title_field: fulfillment_type
      status_field: status
      status_render: badge

    sections:
      - title: 基本信息
        fields:
          - field: fulfillment_type
            label: 履约类型
            render: badge
          - field: supplier_booking_ref
            label: 供应商预订号

      - title: 票证
        fields:
          - field: voucher_or_ticket_ref
            label: 凭证/票号
          - field: ticket_refs
            label: 票证明细
            format: json

      - title: 状态
        fields:
          - field: status
            label: 履约状态
            render: badge
          - field: boarding_status
            label: 登机/乘车状态
            render: badge
          - field: waitlist_result
            label: 候补结果
            render: badge
          - field: change_result
            label: 改签结果
            render: badge

      - title: 异常
        fields:
          - field: failure_reason
            label: 失败原因
          - field: used_at
            label: 使用时间
            format: datetime

    actions:
      - label: 确认预订
        action: confirm_booking
        variant: primary
        visible_when:
          field: status
          op: eq
          value: pending
      - label: 出票/出凭证
        action: issue_voucher_or_ticket
        variant: primary
        visible_when:
          field: status
          op: eq
          value: confirmed
      - label: 标记使用中
        action: mark_in_use
        variant: primary
        visible_when:
          field: status
          op: eq
          value: issued
      - label: 完成履约
        action: complete_fulfillment
        variant: primary
        visible_when:
          field: status
          op: eq
          value: in_use
      - label: 取消履约
        action: cancel_fulfillment
        variant: danger
        confirm: true
        visible_when:
          field: status
          op: in
          value:
            - pending
            - confirmed
      - label: 标记失败
        action: fail_fulfillment
        variant: danger
        visible_when:
          field: status
          op: in
          value:
            - pending
            - confirmed
