# TravelExt — POC 试验扩展（跨实体 workflow / determine_actions / event_consumers / 4 个新实体）
# 依赖 Travel Core（unibo/models/travel/travel.ubo.yaml）
# 通过 cross_domain_ref 引用 Travel 域实体
version: "1.0"
domain:
  name: TravelExt
  subdomain: travel_ext
  description: Travel POC 扩展域，包含改签单、退票单、差旅政策、差标校验等试验实体与跨实体流程

  cross_domain_refs:
    - domain: Travel
      entities: [TravelOrder, TravelFulfillment]

entities:
  - name: TravelChangeOrder
    description: 改签单，记录针对已有 TravelOrder 的改签请求、差价与审批状态
    aggregate_root: true
    state_machine:
      initial_state: pending
      state_attribute: status
      states: [pending, approved, completed, rejected]
      transitions:
        - from: pending
          to: approved
          event: approve
        - from: pending
          to: rejected
          event: reject
        - from: approved
          to: completed
          event: complete
        - from: pending
          to: completed
          event: complete_direct
    attributes:
      - name: id
        type: uuid
        primary_key: true
        generated: true
      - name: change_reason
        type: string
        description: 改签原因
      - name: price_difference
        type: string
        description: 差价
      - name: change_fee
        type: string
        description: 改签手续费
      - name: new_offer_id
        type: string
        description: 新报价ID（可能是 FlightOffer/TrainOffer/HotelOffer，不做外键）
      - name: status
        type: enum
        constraints:
          values: ["pending", "approved", "completed", "rejected"]
        default: "pending"
      - name: approval_mode
        type: enum
        constraints:
          values: ["none", "self", "oa"]
        default: "self"
        description: 审批模式快照；none 表示跳过审批，self/oa 表示进入审批流
      - name: inserted_at
        type: datetime
        generated: true
      - name: updated_at
        type: datetime
        generated: true
    relationships:
      - name: original_order
        type: belongs_to
        target: TravelOrder
        target_domain: Travel
        foreign_key: original_order_id
        required: true
        description: 被改签的原始订单
    identities:
      - name: unique_order_status
        keys: [original_order_id, status]
    actions:
      - name: create
        type: create
        primary: true
        accept: [original_order_id, change_reason, price_difference, change_fee, new_offer_id, approval_mode]
      - name: read
        type: read
        primary: true
      - name: approve
        type: update
        accept: []
      - name: reject
        type: update
        accept: []
      - name: complete
        type: update
        accept: []
      - name: complete_direct
        type: update
        accept: []
    validations:
      - rule: present
        field: original_order_id
        on: [create]
      - rule: one_of
        field: status
        params: {values: ["pending"]}
        on: [approve, reject]
        message: 只有 pending 改签单可以审批或拒绝
      - rule: one_of
        field: status
        params: {values: ["approved"]}
        on: [complete]
        message: 只有 approved 改签单可以完成
      - rule: one_of
        field: approval_mode
        params: {values: ["none"]}
        on: [complete_direct]
        message: 只有关闭审批的改签单可以直接完成
      - rule: one_of
        field: status
        params: {values: ["pending"]}
        on: [complete_direct]
        message: 关闭审批时，pending 改签单可直接完成
    changes:
      - effect: set_attribute
        field: status
        value: "approved"
        on: [approve]
      - effect: set_attribute
        field: status
        value: "rejected"
        on: [reject]
      - effect: set_attribute
        field: status
        value: "completed"
        on: [complete]
      - effect: set_attribute
        field: status
        value: "completed"
        on: [complete_direct]
      - effect: set_attribute
        field: id
        expr:
          op: ref
          args:
            - id
        on: [create, approve, reject, complete, complete_direct]
        description: AUTO_WRITE_ANCHOR
    events:
      - on: approve
        topic: travel.change_order.approved
      - on: reject
        topic: travel.change_order.rejected
      - on: complete
        topic: travel.change_order.completed
      - on: complete_direct
        topic: travel.change_order.completed
    scenarios:
      - "create 创建改签单 -> approve 审批通过 -> complete 改签完成"
      - "create 创建改签单 -> reject 审批拒绝"
      - "create 创建改签单（approval_mode=none）-> complete_direct 直接完成"
    workflows:
      - name: change_order_lifecycle
        description: 改签单生命周期：审批开启时 pending → approved → completed / rejected；审批关闭时 pending → completed
        steps:
          - action: create
            next: [approve, reject, complete_direct]
          - action: approve
            trigger_event: travel.change_order.approved
            next: [complete]
          - action: reject
            trigger_event: travel.change_order.rejected
          - action: complete
            trigger_event: travel.change_order.completed
          - action: complete_direct
            trigger_event: travel.change_order.completed
      # R43 跨实体 workflow：改签审批通过后回写原订单
      - name: change_approval_to_order_confirm
        description: 改签审批完成后，触发原订单执行 confirm_change；失败时回滚改签单为 rejected
        steps:
          - action: complete
            entity: TravelChangeOrder
          - action: confirm_change
            entity: TravelOrder
            depends_on: [complete]
            input:
              id: "{{complete.original_order_id}}"
        compensation:
          - entity: TravelChangeOrder
            action: reject
    determine_actions:
      - name: notify_order_change_approved
        scope: cross_aggregate
        mode: async_write_back
        phase: post_commit
        read_set:
          - original_order.status
        write_set:
          - status
    business_rules:
      - id: TRAVEL-CHANGE-ORDER-01
        description: TravelChangeOrder 通过 original_order_id 关联原订单，new_offer_id 为字符串引用，不做跨实体外键
      - id: TRAVEL-CHANGE-ORDER-02
        description: 同一原订单在同一 status 下唯一，防止重复改签请求
      - id: TRAVEL-CHANGE-ORDER-03
        description: approval_mode=none 时跳过审批，允许改签单从 pending 直接完成

  - name: TravelRefundOrder
    description: 退票/退订单，记录针对已有 TravelOrder 的退票请求、手续费与退款状态
    aggregate_root: true
    state_machine:
      initial_state: pending
      state_attribute: status
      states: [pending, approved, refunded, rejected]
      transitions:
        - from: pending
          to: approved
          event: approve
        - from: pending
          to: rejected
          event: reject
        - from: approved
          to: refunded
          event: refund
        - from: pending
          to: refunded
          event: refund_direct
    attributes:
      - name: id
        type: uuid
        primary_key: true
        generated: true
      - name: refund_reason
        type: string
        description: 退票原因
      - name: refund_fee
        type: string
        description: 退票手续费
      - name: refund_amount
        type: string
        description: 实退金额
      - name: status
        type: enum
        constraints:
          values: ["pending", "approved", "refunded", "rejected"]
        default: "pending"
      - name: approval_mode
        type: enum
        constraints:
          values: ["none", "self", "oa"]
        default: "self"
        description: 审批模式快照；none 表示跳过审批，self/oa 表示进入审批流
      - name: inserted_at
        type: datetime
        generated: true
      - name: updated_at
        type: datetime
        generated: true
    relationships:
      - name: original_order
        type: belongs_to
        target: TravelOrder
        target_domain: Travel
        foreign_key: original_order_id
        required: true
        description: 被退票的原始订单
    identities:
      - name: unique_order_status
        keys: [original_order_id, status]
    actions:
      - name: create
        type: create
        primary: true
        accept: [original_order_id, refund_reason, refund_fee, refund_amount, approval_mode]
      - name: read
        type: read
        primary: true
      - name: approve
        type: update
        accept: []
      - name: reject
        type: update
        accept: []
      - name: refund
        type: update
        accept: []
      - name: refund_direct
        type: update
        accept: []
    validations:
      - rule: present
        field: original_order_id
        on: [create]
      - rule: one_of
        field: status
        params: {values: ["pending"]}
        on: [approve, reject]
        message: 只有 pending 退票单可以审批或拒绝
      - rule: one_of
        field: status
        params: {values: ["approved"]}
        on: [refund]
        message: 只有 approved 退票单可以执行退款
      - rule: one_of
        field: approval_mode
        params: {values: ["none"]}
        on: [refund_direct]
        message: 只有关闭审批的退票单可以直接退款
      - rule: one_of
        field: status
        params: {values: ["pending"]}
        on: [refund_direct]
        message: 关闭审批时，pending 退票单可直接退款
    changes:
      - effect: set_attribute
        field: status
        value: "approved"
        on: [approve]
      - effect: set_attribute
        field: status
        value: "rejected"
        on: [reject]
      - effect: set_attribute
        field: status
        value: "refunded"
        on: [refund]
      - effect: set_attribute
        field: status
        value: "refunded"
        on: [refund_direct]
      - effect: set_attribute
        field: id
        expr:
          op: ref
          args:
            - id
        on: [create, approve, reject, refund, refund_direct]
        description: AUTO_WRITE_ANCHOR
    events:
      - on: approve
        topic: travel.refund_order.approved
      - on: reject
        topic: travel.refund_order.rejected
      - on: refund
        topic: travel.refund_order.refunded
      - on: refund_direct
        topic: travel.refund_order.refunded
    scenarios:
      - "create 创建退票单 -> approve 审批通过 -> refund 退款完成"
      - "create 创建退票单 -> reject 审批拒绝"
      - "create 创建退票单（approval_mode=none）-> refund_direct 直接退款"
    workflows:
      - name: refund_order_lifecycle
        description: 退票单生命周期：审批开启时 pending → approved → refunded / rejected；审批关闭时 pending → refunded
        steps:
          - action: create
            next: [approve, reject, refund_direct]
          - action: approve
            trigger_event: travel.refund_order.approved
            next: [refund]
          - action: reject
            trigger_event: travel.refund_order.rejected
          - action: refund
            trigger_event: travel.refund_order.refunded
          - action: refund_direct
            trigger_event: travel.refund_order.refunded
      # R43 跨实体 workflow：退票完成后回写原订单为取消状态
      - name: refund_to_order_cancel
        description: 退票单退款完成后，触发原订单执行 approve_cancel；失败时退票单状态仍保持 refunded（退款已完成，订单取消为最终补偿）
        steps:
          - action: refund
            entity: TravelRefundOrder
          - action: approve_cancel
            entity: TravelOrder
            depends_on: [refund]
            input:
              id: "{{refund.original_order_id}}"
        compensation:
          - entity: TravelRefundOrder
            action: reject
    determine_actions:
      - name: notify_order_refund_approved
        scope: cross_aggregate
        mode: async_write_back
        phase: post_commit
        read_set:
          - original_order.status
        write_set:
          - status
    business_rules:
      - id: TRAVEL-REFUND-ORDER-01
        description: TravelRefundOrder 通过 original_order_id 关联原订单，实际退款动作可由 Payment 域处理
      - id: TRAVEL-REFUND-ORDER-02
        description: 同一原订单在同一 status 下唯一，防止重复退票请求
      - id: TRAVEL-REFUND-ORDER-03
        description: approval_mode=none 时跳过审批，允许退票单从 pending 直接退款

  - name: TravelPolicy
    description: 差旅标准政策，定义不同企业、职级、城市等级下的差旅费用上限与超标策略
    aggregate_root: true
    attributes:
      - name: id
        type: uuid
        primary_key: true
        generated: true
      - name: policy_name
        type: string
        required: true
        description: 政策名称，如"总部差旅标准"
      - name: product_type
        type: enum
        constraints:
          values: ["flight", "hotel", "train", "car"]
        required: true
        description: 适用商品类型
      - name: employee_level
        type: string
        description: 职级标识
      - name: city_tier
        type: string
        description: 城市等级（tier_1/tier_2/tier_3）
      - name: season
        type: string
        description: 淡旺季标识（可选）
      - name: max_amount
        type: integer
        description: 金额上限（单位分）
      - name: cabin_class_limit
        type: string
        description: 舱位限制
      - name: hotel_star_limit
        type: string
        description: 酒店星级限制
      - name: exceed_strategy
        type: enum
        constraints:
          values: ["block", "require_reason", "require_approval", "personal_pay"]
        required: true
        description: 超标处理策略
      - name: approval_mode
        type: enum
        constraints:
          values: ["none", "self", "oa"]
        default: "self"
        description: 审批模式；none 表示关闭审批，self/oa 表示进入对应审批流
      - name: personal_pay_ratio
        type: integer
        description: 个人支付比例 0-100
      - name: is_active
        type: boolean
        default: true
        description: 是否启用
      - name: enterprise_id
        type: string
        description: 企业标识（不做跨域外键）
      - name: inserted_at
        type: datetime
        generated: true
      - name: updated_at
        type: datetime
        generated: true
    identities:
      - name: unique_policy_scope
        keys: [policy_name, product_type, employee_level, city_tier]
    actions:
      - name: create
        type: create
        primary: true
        accept: [policy_name, product_type, employee_level, city_tier, season, max_amount, cabin_class_limit, hotel_star_limit, exceed_strategy, approval_mode, personal_pay_ratio, enterprise_id]
      - name: read
        type: read
        primary: true
      - name: update
        type: update
        primary: true
        accept: [policy_name, season, max_amount, cabin_class_limit, hotel_star_limit, exceed_strategy, approval_mode, personal_pay_ratio]
      - name: match_policy
        type: read
        arguments:
          - name: product_type
            type: string
            required: true
          - name: employee_level
            type: string
          - name: city_tier
            type: string
        filter:
          - field: is_active
            op: eq
            value: true
          - field: product_type
            op: eq
            value: { arg: product_type }
        sort: [employee_level, city_tier]
        limit: 1
      - name: activate
        type: update
        accept: []
      - name: deactivate
        type: update
        accept: []
    validations:
      - rule: present
        field: policy_name
        on: [create]
      - rule: present
        field: product_type
        on: [create]
      - rule: present
        field: exceed_strategy
        on: [create]
      - rule: one_of
        field: is_active
        params: {values: [false]}
        on: [activate]
        message: 只有未启用的政策可以激活
      - rule: one_of
        field: is_active
        params: {values: [true]}
        on: [deactivate]
        message: 只有已启用的政策可以停用
      - rule: compare
        field: personal_pay_ratio
        params: {greater_than_or_equal_to: 0, less_than_or_equal_to: 100}
        message: personal_pay_ratio 必须在 0-100 之间
    changes:
      - effect: set_attribute
        field: is_active
        value: true
        on: [activate]
      - effect: set_attribute
        field: is_active
        value: false
        on: [deactivate]
      - effect: set_attribute
        field: id
        expr:
          op: ref
          args:
            - id
        on: [create, update, activate, deactivate]
        description: AUTO_WRITE_ANCHOR
    events:
      - on: activate
        topic: travel.policy.activated
      - on: deactivate
        topic: travel.policy.deactivated
    scenarios:
      - "create 创建差旅政策 -> update 修改政策参数"
      - "create 创建差旅政策 -> deactivate 停用政策 -> activate 重新激活"
    workflows:
      - name: policy_lifecycle
        description: 差旅政策生命周期：active ↔ inactive
        steps:
          - action: create
            next: [update, deactivate]
          - action: update
            next: [deactivate]
          - action: deactivate
            trigger_event: travel.policy.deactivated
            next: [activate]
          - action: activate
            trigger_event: travel.policy.activated
            next: [update, deactivate]
    business_rules:
      - id: TRAVEL-POLICY-01
        description: TravelPolicy 按 policy_name + product_type + employee_level + city_tier 唯一，同一维度组合不允许重复
      - id: TRAVEL-POLICY-02
        description: exceed_strategy 为四值枚举（block/require_reason/require_approval/personal_pay），决定超标时的处理方式
      - id: TRAVEL-POLICY-03
        description: enterprise_id 为字符串标识，不做跨域外键，由调用方传入
      - id: TRAVEL-POLICY-04
        description: approval_mode 控制 require_approval 是否真正进入审批；approval_mode=none 时不创建审批请求

  - name: TravelPolicyCheck
    description: 差标校验记录，记录订单下单时针对差旅政策的校验结果、超标金额与处理策略
    aggregate_root: true
    attributes:
      - name: id
        type: uuid
        primary_key: true
        generated: true
      - name: check_result
        type: enum
        constraints:
          values: ["compliant", "exceeded", "blocked"]
        required: true
        description: 校验结果
      - name: policy_amount
        type: integer
        description: 差标金额（单位分）
      - name: actual_amount
        type: integer
        description: 实际金额（单位分）
      - name: exceed_amount
        type: integer
        description: 超标金额
      - name: exceed_ratio
        type: string
        description: 超标比例（如"15%"）
      - name: exceed_strategy
        type: string
        description: 命中的超标策略
      - name: exceed_reason
        type: string
        description: 超标原因（员工填写）
      - name: personal_pay_amount
        type: integer
        description: 个人支付部分
      - name: approval_request_id
        type: string
        description: 审批请求ID（不做跨域外键）
      - name: approval_mode
        type: enum
        constraints:
          values: ["none", "self", "oa"]
        default: "self"
        description: 命中政策时的审批模式快照
      - name: inserted_at
        type: datetime
        generated: true
      - name: updated_at
        type: datetime
        generated: true
    relationships:
      - name: order
        type: belongs_to
        target: TravelOrder
        target_domain: Travel
        foreign_key: order_id
        required: true
        description: 关联的出行订单
      - name: policy
        type: belongs_to
        target: TravelPolicy
        foreign_key: policy_id
        required: true
        description: 命中的差旅政策
    identities:
      - name: unique_order
        keys: [order_id]
    actions:
      - name: create
        type: create
        primary: true
        accept: [order_id, policy_id, check_result, policy_amount, actual_amount, exceed_amount, exceed_ratio, exceed_strategy, exceed_reason, personal_pay_amount, approval_request_id, approval_mode]
      - name: read
        type: read
        primary: true
    validations:
      - rule: present
        field: order_id
        on: [create]
      - rule: present
        field: policy_id
        on: [create]
      - rule: present
        field: check_result
        on: [create]
    changes:
      - effect: set_attribute
        field: id
        expr:
          op: ref
          args:
            - id
        on: [create]
        description: AUTO_WRITE_ANCHOR
    business_rules:
      - id: TRAVEL-POLICY-CHECK-01
        description: 每个 TravelOrder 最多关联一条 TravelPolicyCheck 记录
      - id: TRAVEL-POLICY-CHECK-02
        description: approval_request_id 为字符串标识，不做跨域外键，由审批系统回填
      - id: TRAVEL-POLICY-CHECK-03
        description: approval_mode 记录命中政策时的审批模式；approval_mode=none 时即使 require_approval 也不进入审批流
