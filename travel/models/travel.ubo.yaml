# UniBO 预置模型：Travel vertical（电商域 overlay）
# 范围：hotel / flight / vacation / train offer + unified travel order + unified travel fulfillment
# 跨域引用：Sales::Customer, Payment::Payment, Delivery::Shipment
# 分层约定（#766）：*_id/*_code/*_ref 等字段用于静态资源引用（CoreGeo/TravelStatic），*_snapshot/*_payload 与“快照”语义字段用于业务事实冻结（Vertical）
# 分层约定（#766）：Travel 层可组合引用与快照，但不回写 OFBiz/Core 主数据结构
version: "1.0"
domain:
  name: Travel
  subdomain: travel
  description: Travel vertical canonical model，作为电商域 overlay，通过 target_domain 引用 Sales/Payment/Delivery 域实体
entities:
  - name: TravelHotel
    description: 酒店主数据（Travel 层，来源 OFBiz Product）
    source:
      base: Product
      domain: ofbiz/product
      filter: {product_type_id: TRAVEL_HOTEL}
    aggregate_root: true
    attributes:
    - name: id
      type: uuid
      primary_key: true
      generated: true
    - name: hotel_code
      type: string
      required: true
      description: 酒店规范编码
    - name: hotel_name
      type: string
      required: true
      description: 酒店名称
    - name: city_code
      type: string
      description: 城市编码冗余（便于兼容检索）
    - name: hotel_star
      type: string
      description: 酒店星级
    - name: status
      type: enum
      constraints:
        values: [active, inactive]
      default: active
    relationships:
    - name: city
      type: belongs_to
      target: TravelCity
      target_domain: Ecommerce
      foreign_key: city_id
    identities:
    - name: unique_hotel_code
      keys: [hotel_code]
    actions:
    - name: create
      type: create
      primary: true
      accept: [hotel_code, hotel_name, city_id, city_code, hotel_star, status]
    - name: read
      type: read
      primary: true
    - name: update
      type: update
      primary: true
      accept: [hotel_name, city_id, city_code, hotel_star, status]
    changes:
    - effect: set_attribute
      field: id
      expr:
        op: ref
        args:
        - id
      on:
      - create
      - update
      description: AUTO_WRITE_ANCHOR

  - name: TravelRoomType
    description: 酒店房型主数据（Travel 层，来源 OFBiz ProductFeature）
    source:
      base: ProductFeature
      domain: ofbiz/product
      filter: {product_feature_type_id: ROOM_TYPE}
    aggregate_root: true
    attributes:
    - name: id
      type: uuid
      primary_key: true
      generated: true
    - name: room_type_code
      type: string
      required: true
      description: 房型规范编码
    - name: room_type_name
      type: string
      required: true
      description: 房型名称
    - name: hotel_code
      type: string
      description: 酒店编码冗余（便于兼容检索）
    - name: bed_type
      type: string
      description: 床型
    - name: status
      type: enum
      constraints:
        values: [active, inactive]
      default: active
    relationships:
    - name: hotel
      type: belongs_to
      target: TravelHotel
      foreign_key: hotel_id
    identities:
    - name: unique_room_type_code
      keys: [room_type_code]
    actions:
    - name: create
      type: create
      primary: true
      accept: [room_type_code, room_type_name, hotel_id, hotel_code, bed_type, status]
    - name: read
      type: read
      primary: true
    - name: update
      type: update
      primary: true
      accept: [room_type_name, hotel_id, hotel_code, bed_type, status]
    changes:
    - effect: set_attribute
      field: id
      expr:
        op: ref
        args:
        - id
      on:
      - create
      - update
      description: AUTO_WRITE_ANCHOR

  - name: TravelAirline
    description: 航司主数据（Travel 层，来源 OFBiz PartyGroup）
    source:
      base: PartyGroup
      domain: ofbiz/party
      filter: {industry: AIRLINE}
    aggregate_root: true
    attributes:
    - name: id
      type: uuid
      primary_key: true
      generated: true
    - name: airline_code
      type: string
      required: true
      description: 航司规范编码
    - name: airline_name
      type: string
      required: true
      description: 航司名称
    - name: iata_code
      type: string
      description: IATA 二字码
    - name: icao_code
      type: string
      description: ICAO 三字码
    - name: status
      type: enum
      constraints:
        values: [active, inactive]
      default: active
    identities:
    - name: unique_airline_code
      keys: [airline_code]
    actions:
    - name: create
      type: create
      primary: true
      accept: [airline_code, airline_name, iata_code, icao_code, status]
    - name: read
      type: read
      primary: true
    - name: update
      type: update
      primary: true
      accept: [airline_name, iata_code, icao_code, status]
    changes:
    - effect: set_attribute
      field: id
      expr:
        op: ref
        args:
        - id
      on:
      - create
      - update
      description: AUTO_WRITE_ANCHOR

  - name: TravelCabinClass
    description: 舱位主数据（Travel 层，来源 OFBiz Enumeration）
    source:
      base: Enumeration
      domain: ofbiz/common
      filter: {enum_type_id: CABIN_CLASS}
    aggregate_root: true
    attributes:
    - name: id
      type: uuid
      primary_key: true
      generated: true
    - name: cabin_class_code
      type: string
      required: true
      description: 舱位规范编码
    - name: cabin_class_name
      type: string
      required: true
      description: 舱位名称
    - name: cabin_rank
      type: integer
      description: 舱位等级序
    - name: status
      type: enum
      constraints:
        values: [active, inactive]
      default: active
    identities:
    - name: unique_cabin_class_code
      keys: [cabin_class_code]
    actions:
    - name: create
      type: create
      primary: true
      accept: [cabin_class_code, cabin_class_name, cabin_rank, status]
    - name: read
      type: read
      primary: true
    - name: update
      type: update
      primary: true
      accept: [cabin_class_name, cabin_rank, status]
    changes:
    - effect: set_attribute
      field: id
      expr:
        op: ref
        args:
        - id
      on:
      - create
      - update
      description: AUTO_WRITE_ANCHOR

  - name: TravelStaticCodeMapping
    description: 供应商静态码到 Travel 主数据的映射（Travel 层统一适配）
    source:
      base: DataSource
      domain: ofbiz/common
    aggregate_root: true
    attributes:
    - name: id
      type: uuid
      primary_key: true
      generated: true
    - name: supplier_code
      type: string
      required: true
      description: 供应商编码
    - name: object_type
      type: enum
      required: true
      constraints:
        values: [city, airport, station, hotel, room_type, airline, cabin_class]
      description: 主数据对象类型
    - name: canonical_entity
      type: string
      required: true
      description: Travel 实体名
    - name: canonical_id
      type: uuid
      required: true
      description: Travel 实体 ID
    - name: external_code
      type: string
      required: true
      description: 供应商侧编码
    - name: external_name
      type: string
      description: 供应商侧名称
    - name: status
      type: enum
      constraints:
        values: [active, inactive]
      default: active
    identities:
    - name: unique_supplier_static_code
      keys: [supplier_code, object_type, external_code]
    actions:
    - name: create
      type: create
      primary: true
      accept: [supplier_code, object_type, canonical_entity, canonical_id, external_code, external_name, status]
    - name: read
      type: read
      primary: true
    - name: update
      type: update
      primary: true
      accept: [canonical_entity, canonical_id, external_name, status]
    changes:
    - effect: set_attribute
      field: id
      expr:
        op: ref
        args:
        - id
      on:
      - create
      - update
      description: AUTO_WRITE_ANCHOR
  - name: HotelOffer
    description: 酒店可售 offer，承载房型、价计划、价态和可售规则快照
    aggregate_root: true
    tenancy:
      strategy: attribute
      attribute: tenant_id
    attributes:
      - name: id
        type: uuid
        primary_key: true
        generated: true
      - name: tenant_id
        type: uuid
        required: true
        description: 租户 ID
      - name: host_shop_id
        type: uuid
        description: 宿主商城 ID，仅用于宿主侧隔离和桥接上下文
      # 静态资源引用字段：仅保留可追溯标识，不复制上游主数据详情
      - name: supplier_code
        type: string
        required: true
        description: 供应商编码
      - name: hotel_code
        type: string
        required: true
        description: 酒店编码
      - name: hotel_name
        type: string
        required: true
        description: 酒店名称
      - name: city_code
        type: string
        required: true
        description: 城市编码
      - name: room_type_code
        type: string
        required: true
        description: 房型编码
      - name: rate_plan_code
        type: string
        required: true
        description: 价计划编码
      - name: checkin_date
        type: date
        required: true
        description: 入住日期
      - name: checkout_date
        type: date
        required: true
        description: 离店日期
      # Vertical 可售快照字段：冻结交易时态事实，用于后续下单和审计追溯
      - name: listed_price
        type: decimal
        required: true
        description: 对客展示价快照
      - name: settlement_price
        type: decimal
        description: 结算价快照
      - name: currency
        type: string
        default: CNY
        description: 币种
      - name: inventory_count
        type: integer
        default: 0
        description: 可售库存快照
      - name: cancellation_policy
        type: text
        description: 取消规则快照
      - name: guarantee_policy
        type: text
        description: 担保规则快照
      - name: sale_status
        type: enum
        constraints:
          values: ["draft", "active", "inactive", "expired"]
        default: "draft"
        description: 可售状态
      - name: inserted_at
        type: datetime
        generated: true
      - name: updated_at
        type: datetime
        generated: true
    relationships:
      - name: city_ref
        type: belongs_to
        target: TravelCity
        target_domain: Ecommerce
        foreign_key: city_ref_id
        description: Core 旅行城市主数据引用
      - name: hotel_ref
        type: belongs_to
        target: TravelHotel
        foreign_key: hotel_ref_id
        description: Travel 酒店主数据引用
      - name: room_type_ref
        type: belongs_to
        target: TravelRoomType
        foreign_key: room_type_ref_id
        description: Travel 房型主数据引用
      - name: orders
        type: has_many
        target: TravelOrder
        foreign_key: hotel_offer_id
        description: 基于当前 hotel offer 创建的订单
    identities:
      - name: unique_hotel_offer_snapshot
        keys: [tenant_id, supplier_code, hotel_code, room_type_code, rate_plan_code, checkin_date, checkout_date]
    actions:
      - name: create
        type: create
        primary: true
        accept: [tenant_id, host_shop_id, supplier_code, hotel_code, hotel_ref_id, hotel_name, city_code, city_ref_id, room_type_code, room_type_ref_id, rate_plan_code, checkin_date, checkout_date, listed_price, settlement_price, currency, inventory_count, cancellation_policy, guarantee_policy, sale_status]
      - name: read
        type: read
        primary: true
      - name: update
        type: update
        primary: true
        accept: [hotel_name, city_code, city_ref_id, hotel_ref_id, room_type_ref_id, listed_price, settlement_price, currency, inventory_count, cancellation_policy, guarantee_policy]
      - name: activate
        type: update
        accept: []
      - name: deactivate
        type: update
        accept: []
      - name: expire
        type: update
        accept: []
      - name: destroy
        type: destroy
        primary: true
    validations:
      - rule: present
        field: tenant_id
        on: [create]
      - rule: present
        field: supplier_code
        on: [create]
      - rule: present
        field: hotel_code
        on: [create]
      - rule: present
        field: room_type_code
        on: [create]
      - rule: present
        field: rate_plan_code
        on: [create]
      - rule: compare
        field: listed_price
        params: {greater_than_or_equal_to: 0}
        message: listed_price 不能为负数
      - rule: compare
        field: settlement_price
        params: {greater_than_or_equal_to: 0}
        message: settlement_price 不能为负数
      - rule: compare
        field: inventory_count
        params: {greater_than_or_equal_to: 0}
        message: inventory_count 不能为负数
      - rule: one_of
        field: sale_status
        params: {values: ["draft", "inactive"]}
        on: [activate]
        message: 只有草稿或停用中的 offer 可以 activate
      - rule: one_of
        field: sale_status
        params: {values: ["active"]}
        on: [deactivate, expire]
        message: 只有 active 状态的 offer 可以 deactivate 或 expire
    changes:
      - effect: set_attribute
        field: sale_status
        value: "active"
        on: [activate]
      - effect: set_attribute
        field: sale_status
        value: "inactive"
        on: [deactivate]
      - effect: set_attribute
        field: sale_status
        value: "expired"
        on: [expire]
      - effect: set_attribute
        field: id
        expr:
          op: ref
          args:
            - id
        on: [create, update, activate, deactivate, expire, destroy]
        description: AUTO_WRITE_ANCHOR
    events:
      - on: activate
        topic: travel.catalog.hotel_offer.activated
      - on: deactivate
        topic: travel.catalog.hotel_offer.deactivated
      - on: expire
        topic: travel.catalog.hotel_offer.expired
    scenarios:
      - "create 创建 hotel offer -> update 更新价格库存 -> activate 上架 -> deactivate 下架"
      - "create 创建 hotel offer -> activate 上架 -> expire 过期"
      - "create 创建 hotel offer -> destroy 删除草稿"
    workflows:
      - name: hotel_offer_lifecycle
        description: 酒店 offer 生命周期
        steps:
          - action: create
            next: [update, activate, destroy]
          - action: update
            next: [activate, destroy]
          - action: activate
            trigger_event: travel.catalog.hotel_offer.activated
            next: [deactivate, expire]
          - action: deactivate
            trigger_event: travel.catalog.hotel_offer.deactivated
            next: [activate]
          - action: expire
            trigger_event: travel.catalog.hotel_offer.expired
          - action: destroy
    business_rules:
      - id: TRAVEL-HOTEL-OFFER-01
        description: HotelOffer 仅承载可售快照，不直接承载供应商原始协议结构
      - id: TRAVEL-HOTEL-OFFER-02
        description: sale_status=active 且 inventory_count>0 的 offer 才可用于创建订单
      - id: TRAVEL-HOTEL-OFFER-03
        description: hotel_ref_id/room_type_ref_id 为 Travel 主引用，city_ref_id 为 Core::Ecommerce.TravelCity 引用；hotel_code/city_code/room_type_code 保留兼容检索；listed_price/settlement_price/inventory_count/cancellation_policy/guarantee_policy 为 Vertical 快照字段

  - name: FlightOffer
    description: 机票可售 offer，承载航班、舱位、票规和库存快照
    aggregate_root: true
    tenancy:
      strategy: attribute
      attribute: tenant_id
    attributes:
      - name: id
        type: uuid
        primary_key: true
        generated: true
      - name: tenant_id
        type: uuid
        required: true
      - name: host_shop_id
        type: uuid
        description: 宿主商城 ID，仅用于宿主侧隔离和桥接上下文
      # 静态资源引用字段：仅保留可追溯标识，不复制上游主数据详情
      - name: supplier_code
        type: string
        required: true
        description: 供应商编码
      - name: itinerary_code
        type: string
        required: true
        description: 行程编码
      - name: flight_no
        type: string
        required: true
        description: 航班号
      - name: departure_airport_code
        type: string
        required: true
        description: 出发机场编码
      - name: arrival_airport_code
        type: string
        required: true
        description: 到达机场编码
      - name: departure_at
        type: datetime
        required: true
        description: 起飞时间
      - name: arrival_at
        type: datetime
        required: true
        description: 到达时间
      - name: cabin_class
        type: string
        required: true
        description: 舱等
      - name: fare_family
        type: string
        description: 运价族
      # Vertical 可售快照字段：冻结交易时态事实，用于后续下单和审计追溯
      - name: listed_price
        type: decimal
        required: true
        description: 对客展示价快照
      - name: settlement_price
        type: decimal
        description: 结算价快照
      - name: currency
        type: string
        default: CNY
      - name: seats_available
        type: integer
        default: 0
        description: 可售座位快照
      - name: baggage_policy
        type: text
        description: 行李规则快照
      - name: refund_change_policy
        type: text
        description: 退改规则快照
      - name: sale_status
        type: enum
        constraints:
          values: ["draft", "active", "inactive", "expired"]
        default: "draft"
      - name: inserted_at
        type: datetime
        generated: true
      - name: updated_at
        type: datetime
        generated: true
    relationships:
      - name: departure_airport_ref
        type: belongs_to
        target: TravelAirport
        target_domain: Ecommerce
        foreign_key: departure_airport_ref_id
        description: Travel 出发机场主数据引用
      - name: arrival_airport_ref
        type: belongs_to
        target: TravelAirport
        target_domain: Ecommerce
        foreign_key: arrival_airport_ref_id
        description: Travel 到达机场主数据引用
      - name: airline_ref
        type: belongs_to
        target: TravelAirline
        foreign_key: airline_ref_id
        description: Travel 航司主数据引用
      - name: cabin_class_ref
        type: belongs_to
        target: TravelCabinClass
        foreign_key: cabin_class_ref_id
        description: Travel 舱位主数据引用
      - name: orders
        type: has_many
        target: TravelOrder
        foreign_key: flight_offer_id
        description: 基于当前 flight offer 创建的订单
    identities:
      - name: unique_flight_offer_snapshot
        keys: [tenant_id, supplier_code, itinerary_code, flight_no, departure_at, cabin_class]
    actions:
      - name: create
        type: create
        primary: true
        accept: [tenant_id, host_shop_id, supplier_code, itinerary_code, flight_no, airline_ref_id, departure_airport_code, departure_airport_ref_id, arrival_airport_code, arrival_airport_ref_id, departure_at, arrival_at, cabin_class, cabin_class_ref_id, fare_family, listed_price, settlement_price, currency, seats_available, baggage_policy, refund_change_policy, sale_status]
      - name: read
        type: read
        primary: true
      - name: update
        type: update
        primary: true
        accept: [airline_ref_id, departure_airport_ref_id, arrival_airport_ref_id, cabin_class_ref_id, listed_price, settlement_price, currency, seats_available, baggage_policy, refund_change_policy, fare_family]
      - name: activate
        type: update
        accept: []
      - name: deactivate
        type: update
        accept: []
      - name: expire
        type: update
        accept: []
      - name: destroy
        type: destroy
        primary: true
    validations:
      - rule: present
        field: tenant_id
        on: [create]
      - rule: present
        field: supplier_code
        on: [create]
      - rule: present
        field: itinerary_code
        on: [create]
      - rule: present
        field: flight_no
        on: [create]
      - rule: present
        field: departure_airport_code
        on: [create]
      - rule: present
        field: arrival_airport_code
        on: [create]
      - rule: present
        field: cabin_class
        on: [create]
      - rule: compare
        field: listed_price
        params: {greater_than_or_equal_to: 0}
        message: listed_price 不能为负数
      - rule: compare
        field: settlement_price
        params: {greater_than_or_equal_to: 0}
        message: settlement_price 不能为负数
      - rule: compare
        field: seats_available
        params: {greater_than_or_equal_to: 0}
        message: seats_available 不能为负数
      - rule: one_of
        field: sale_status
        params: {values: ["draft", "inactive"]}
        on: [activate]
        message: 只有草稿或停用中的 offer 可以 activate
      - rule: one_of
        field: sale_status
        params: {values: ["active"]}
        on: [deactivate, expire]
        message: 只有 active 状态的 offer 可以 deactivate 或 expire
    changes:
      - effect: set_attribute
        field: sale_status
        value: "active"
        on: [activate]
      - effect: set_attribute
        field: sale_status
        value: "inactive"
        on: [deactivate]
      - effect: set_attribute
        field: sale_status
        value: "expired"
        on: [expire]
      - effect: set_attribute
        field: id
        expr:
          op: ref
          args:
            - id
        on: [create, update, activate, deactivate, expire, destroy]
        description: AUTO_WRITE_ANCHOR
    events:
      - on: activate
        topic: travel.catalog.flight_offer.activated
      - on: deactivate
        topic: travel.catalog.flight_offer.deactivated
      - on: expire
        topic: travel.catalog.flight_offer.expired
    scenarios:
      - "create 创建 flight offer -> update 更新价格库存 -> activate 上架 -> deactivate 下架"
      - "create 创建 flight offer -> activate 上架 -> expire 过期"
      - "create 创建 flight offer -> destroy 删除草稿"
    workflows:
      - name: flight_offer_lifecycle
        description: 机票 offer 生命周期
        steps:
          - action: create
            next: [update, activate, destroy]
          - action: update
            next: [activate, destroy]
          - action: activate
            trigger_event: travel.catalog.flight_offer.activated
            next: [deactivate, expire]
          - action: deactivate
            trigger_event: travel.catalog.flight_offer.deactivated
            next: [activate]
          - action: expire
            trigger_event: travel.catalog.flight_offer.expired
          - action: destroy
    business_rules:
      - id: TRAVEL-FLIGHT-OFFER-01
        description: FlightOffer 仅承载机票可售快照，不直接承载供应商原始票务协议
      - id: TRAVEL-FLIGHT-OFFER-02
        description: sale_status=active 且 seats_available>0 的 offer 才可用于创建订单
      - id: TRAVEL-FLIGHT-OFFER-03
        description: departure_airport_ref_id/arrival_airport_ref_id/airline_ref_id/cabin_class_ref_id 为 Travel 主引用；departure_airport_code/arrival_airport_code/cabin_class 保留兼容检索；listed_price/settlement_price/seats_available/baggage_policy/refund_change_policy 为 Vertical 快照字段

  - name: VacationOffer
    description: 度假可售 offer，承载套餐、出发日期和预订规则快照
    aggregate_root: true
    tenancy:
      strategy: attribute
      attribute: tenant_id
    attributes:
      - name: id
        type: uuid
        primary_key: true
        generated: true
      - name: tenant_id
        type: uuid
        required: true
      - name: host_shop_id
        type: uuid
        description: 宿主商城 ID，仅用于宿主侧隔离和桥接上下文
      # 静态资源引用字段：仅保留可追溯标识，不复制上游主数据详情
      - name: supplier_code
        type: string
        required: true
        description: 供应商编码
      - name: package_code
        type: string
        required: true
        description: 套餐编码
      - name: package_name
        type: string
        required: true
        description: 套餐名称
      - name: package_type
        type: enum
        constraints:
          values: ["group_tour", "free_travel", "ticket_hotel", "custom"]
        default: "group_tour"
        description: 套餐类型
      - name: departure_city_code
        type: string
        required: true
        description: 出发城市编码
      - name: destination_code
        type: string
        required: true
        description: 目的地编码
      - name: start_date
        type: date
        required: true
        description: 出行开始日期
      - name: end_date
        type: date
        required: true
        description: 出行结束日期
      # Vertical 可售快照字段：冻结交易时态事实，用于后续下单和审计追溯
      - name: listed_price
        type: decimal
        required: true
        description: 对客展示价快照
      - name: settlement_price
        type: decimal
        description: 结算价快照
      - name: currency
        type: string
        default: CNY
      - name: inventory_count
        type: integer
        default: 0
        description: 可售库存快照
      - name: booking_rules
        type: text
        description: 预订规则快照
      - name: cancellation_policy
        type: text
        description: 取消规则快照
      - name: sale_status
        type: enum
        constraints:
          values: ["draft", "active", "inactive", "expired"]
        default: "draft"
      - name: inserted_at
        type: datetime
        generated: true
      - name: updated_at
        type: datetime
        generated: true
    relationships:
      - name: departure_city_ref
        type: belongs_to
        target: TravelCity
        target_domain: Ecommerce
        foreign_key: departure_city_ref_id
        description: Core 出发城市主数据引用
      - name: destination_ref
        type: belongs_to
        target: TravelCity
        target_domain: Ecommerce
        foreign_key: destination_ref_id
        description: Core 目的地主数据引用
      - name: orders
        type: has_many
        target: TravelOrder
        foreign_key: vacation_offer_id
        description: 基于当前 vacation offer 创建的订单
    identities:
      - name: unique_vacation_offer_snapshot
        keys: [tenant_id, supplier_code, package_code, start_date, end_date]
    actions:
      - name: create
        type: create
        primary: true
        accept: [tenant_id, host_shop_id, supplier_code, package_code, package_name, package_type, departure_city_code, departure_city_ref_id, destination_code, destination_ref_id, start_date, end_date, listed_price, settlement_price, currency, inventory_count, booking_rules, cancellation_policy, sale_status]
      - name: read
        type: read
        primary: true
      - name: update
        type: update
        primary: true
        accept: [package_name, package_type, departure_city_ref_id, destination_ref_id, listed_price, settlement_price, currency, inventory_count, booking_rules, cancellation_policy]
      - name: activate
        type: update
        accept: []
      - name: deactivate
        type: update
        accept: []
      - name: expire
        type: update
        accept: []
      - name: destroy
        type: destroy
        primary: true
    validations:
      - rule: present
        field: tenant_id
        on: [create]
      - rule: present
        field: supplier_code
        on: [create]
      - rule: present
        field: package_code
        on: [create]
      - rule: present
        field: package_name
        on: [create]
      - rule: present
        field: departure_city_code
        on: [create]
      - rule: present
        field: destination_code
        on: [create]
      - rule: compare
        field: listed_price
        params: {greater_than_or_equal_to: 0}
        message: listed_price 不能为负数
      - rule: compare
        field: settlement_price
        params: {greater_than_or_equal_to: 0}
        message: settlement_price 不能为负数
      - rule: compare
        field: inventory_count
        params: {greater_than_or_equal_to: 0}
        message: inventory_count 不能为负数
      - rule: one_of
        field: sale_status
        params: {values: ["draft", "inactive"]}
        on: [activate]
        message: 只有草稿或停用中的 offer 可以 activate
      - rule: one_of
        field: sale_status
        params: {values: ["active"]}
        on: [deactivate, expire]
        message: 只有 active 状态的 offer 可以 deactivate 或 expire
    changes:
      - effect: set_attribute
        field: sale_status
        value: "active"
        on: [activate]
      - effect: set_attribute
        field: sale_status
        value: "inactive"
        on: [deactivate]
      - effect: set_attribute
        field: sale_status
        value: "expired"
        on: [expire]
      - effect: set_attribute
        field: id
        expr:
          op: ref
          args:
            - id
        on: [create, update, activate, deactivate, expire, destroy]
        description: AUTO_WRITE_ANCHOR
    events:
      - on: activate
        topic: travel.catalog.vacation_offer.activated
      - on: deactivate
        topic: travel.catalog.vacation_offer.deactivated
      - on: expire
        topic: travel.catalog.vacation_offer.expired
    scenarios:
      - "create 创建 vacation offer -> update 更新价格库存 -> activate 上架 -> deactivate 下架"
      - "create 创建 vacation offer -> activate 上架 -> expire 过期"
      - "create 创建 vacation offer -> destroy 删除草稿"
    workflows:
      - name: vacation_offer_lifecycle
        description: 度假 offer 生命周期
        steps:
          - action: create
            next: [update, activate, destroy]
          - action: update
            next: [activate, destroy]
          - action: activate
            trigger_event: travel.catalog.vacation_offer.activated
            next: [deactivate, expire]
          - action: deactivate
            trigger_event: travel.catalog.vacation_offer.deactivated
            next: [activate]
          - action: expire
            trigger_event: travel.catalog.vacation_offer.expired
          - action: destroy
    business_rules:
      - id: TRAVEL-VACATION-OFFER-01
        description: VacationOffer 仅承载度假套餐可售快照，不直接承载供应商原始套餐协议
      - id: TRAVEL-VACATION-OFFER-02
        description: sale_status=active 且 inventory_count>0 的 offer 才可用于创建订单
      - id: TRAVEL-VACATION-OFFER-03
        description: departure_city_ref_id/destination_ref_id 为 Core 主引用；departure_city_code/destination_code 保留兼容检索；listed_price/settlement_price/inventory_count/booking_rules/cancellation_policy 为 Vertical 快照字段

