[package]
name = "hospital_scheduling_solver"
version = "0.1.0"
edition = "2024"

[lib]
name = "hospital_scheduling_solver"
path = "src/lib.rs"

[features]
default = []
cp_sat_backend = ["dep:cp_sat"]

[dependencies]
cp_sat = { version = "0.3.3", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
